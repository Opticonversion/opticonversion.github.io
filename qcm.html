<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="QCM du BTS Opticien-Lunetier classés par épreuve : analyse de la vision, optique géométrique et physique, ETSO, mathématiques. Corrigés et expliqués.">
<title>QCM BTS OL par épreuve · Opticonversion</title>
<style>
  :root {
    --fond: #f6f7f9;
    --carte: #ffffff;
    --texte: #1b1f24;
    --doux: #5c6673;
    --accent: #1f6feb;
    --bord: #d9dee5;
    --vert: #1a7f37;
    --vert-fond: #e6f4ea;
    --rouge: #cf222e;
    --rouge-fond: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f1216;
      --carte: #181c22;
      --texte: #e6e9ed;
      --doux: #9aa4b1;
      --accent: #5b9bff;
      --bord: #2a313a;
      --vert: #4ac26b;
      --vert-fond: #12261a;
      --rouge: #ff7b72;
      --rouge-fond: #2d1517;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  nav { display: flex; gap: 16px; margin-bottom: 20px; font-size: 0.95rem; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a.actif { color: var(--texte); font-weight: 600; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sous-titre { color: var(--doux); margin: 0 0 24px; }
  section {
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: 12px;
    padding: 20px;
  }

  /* --- Choix de l'épreuve --- */
  .epreuves { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .epreuve {
    text-align: left;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: 12px;
    padding: 16px;
    color: var(--texte);
    font: inherit;
    cursor: pointer;
  }
  .epreuve:hover:not(:disabled) { border-color: var(--accent); }
  .epreuve:disabled { cursor: default; opacity: 0.55; }
  .epreuve .code { color: var(--accent); font-weight: 700; font-size: 0.85rem; }
  .epreuve .nom { display: block; font-weight: 600; margin: 2px 0 4px; }
  .epreuve .info { color: var(--doux); font-size: 0.85rem; }
  .retour { background: none; border: none; color: var(--accent); font: inherit; cursor: pointer; padding: 0; margin-bottom: 12px; }

  /* --- Thèmes --- */
  .themes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .theme {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--bord);
    background: var(--carte);
    color: var(--texte);
    cursor: pointer;
    font-size: 0.9rem;
  }
  .theme.actif { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* --- Questions --- */
  .progression { color: var(--doux); font-size: 0.85rem; margin-bottom: 8px; }
  .enonce { font-size: 1.15rem; font-weight: 600; margin: 0 0 16px; }
  .choix { display: flex; flex-direction: column; gap: 10px; }
  .choix button {
    text-align: left;
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid var(--bord);
    background: var(--fond);
    color: var(--texte);
    cursor: pointer;
  }
  .choix button:hover:not(:disabled) { border-color: var(--accent); }
  .choix button:disabled { cursor: default; }
  .choix button.juste { border-color: var(--vert); background: var(--vert-fond); }
  .choix button.faux { border-color: var(--rouge); background: var(--rouge-fond); }
  .explication { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--fond); }
  .bouton {
    margin-top: 16px;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .score { font-size: 2rem; font-weight: 700; margin: 0; }
  .erreurs li { margin-bottom: 10px; }
  .doux { color: var(--doux); }
</style>
</head>
<body>
<main>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="calculateurs.html">Calculateurs</a>
    <a href="qcm.html" class="actif">QCM</a>
  </nav>
  <h1 id="titre">QCM du BTS OL</h1>
  <p class="sous-titre" id="sous-titre">Choisis une épreuve. Les questions reprennent ce qui tombe le plus souvent à l'examen.</p>

  <div id="ecran-epreuves" class="epreuves"></div>

  <div id="ecran-qcm" hidden>
    <button class="retour" id="retour">← Toutes les épreuves</button>
    <div class="themes" id="themes"></div>
    <section id="zone"></section>
  </div>
</main>

<!-- On charge d'abord les questions, puis le moteur qui les affiche -->
<script src="epreuves.js"></script>
<script src="questions-U41.js"></script>
<script src="questions-U42.js"></script>
<script src="questions-U43.js"></script>
<script src="questions-U5.js"></script>
<script src="questions-U3.js"></script>
<script>
  // ---------------- L'état du QCM ----------------
  let epreuveChoisie = null;   // ex. "U5"
  let themeChoisi = "Tous";
  let serie = [];              // les questions de la partie, mélangées
  let numero = 0;
  let score = 0;
  let erreurs = [];

  const zone = document.getElementById("zone");

  function melanger(liste) {
    const copie = liste.slice();
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }

  const questionsDe = code => QUESTIONS.filter(q => q.epreuve === code);

  // ---------------- Écran 1 : choisir une épreuve ----------------
  function afficherEpreuves() {
    epreuveChoisie = null;
    document.getElementById("ecran-qcm").hidden = true;
    document.getElementById("titre").textContent = "QCM du BTS OL";
    document.getElementById("sous-titre").textContent =
      "Choisis une épreuve. Les questions reprennent ce qui tombe le plus souvent à l'examen.";

    const conteneur = document.getElementById("ecran-epreuves");
    conteneur.hidden = false;
    conteneur.innerHTML = "";

    EPREUVES.forEach(e => {
      const nb = questionsDe(e.code).length;
      const b = document.createElement("button");
      b.className = "epreuve";
      b.disabled = nb === 0;
      b.innerHTML = '<span class="code"></span><span class="nom"></span><span class="info"></span>';
      b.querySelector(".code").textContent = e.code + (e.court ? " · " + e.court : "");
      b.querySelector(".nom").textContent = e.nom;
      b.querySelector(".info").textContent = e.detail + " · " + (nb > 0 ? nb + " questions" : "bientôt");
      b.onclick = () => { location.hash = e.code; };
      conteneur.appendChild(b);
    });
  }

  // ---------------- Écran 2 : le QCM d'une épreuve ----------------
  function ouvrirEpreuve(code) {
    const e = EPREUVES.find(x => x.code === code);
    if (!e || questionsDe(code).length === 0) { afficherEpreuves(); return; }

    epreuveChoisie = code;
    themeChoisi = "Tous";
    document.getElementById("ecran-epreuves").hidden = true;
    document.getElementById("ecran-qcm").hidden = false;
    document.getElementById("titre").textContent = e.nom;
    document.getElementById("sous-titre").textContent = e.code + " · " + e.detail;
    afficherThemes();
    demarrer();
  }

  function afficherThemes() {
    const qs = questionsDe(epreuveChoisie);
    const themes = ["Tous", ...new Set(qs.map(q => q.theme))];
    const conteneur = document.getElementById("themes");
    conteneur.innerHTML = "";
    themes.forEach(t => {
      const nb = t === "Tous" ? qs.length : qs.filter(q => q.theme === t).length;
      const b = document.createElement("button");
      b.className = "theme" + (t === themeChoisi ? " actif" : "");
      b.textContent = t + " (" + nb + ")";
      b.onclick = () => { themeChoisi = t; afficherThemes(); demarrer(); };
      conteneur.appendChild(b);
    });
  }

  function demarrer() {
    const qs = questionsDe(epreuveChoisie);
    const choisies = themeChoisi === "Tous" ? qs : qs.filter(q => q.theme === themeChoisi);
    serie = melanger(choisies).map(q => {
      const reponses = melanger(q.choix.map((texte, i) => ({ texte, juste: i === q.bonne })));
      return { ...q, reponses };
    });
    numero = 0;
    score = 0;
    erreurs = [];
    afficherQuestion();
  }

  function afficherQuestion() {
    const q = serie[numero];
    zone.innerHTML =
      '<div class="progression">Question ' + (numero + 1) + " / " + serie.length +
      " · " + q.theme +
      (q.session ? " · " + (q.session === "complément" ? "complément" : "type BTS " + q.session) : "") +
      " · Score : " + score + "</div>" +
      '<p class="enonce"></p><div class="choix"></div>';
    zone.querySelector(".enonce").textContent = q.question;

    const blocChoix = zone.querySelector(".choix");
    q.reponses.forEach(r => {
      const b = document.createElement("button");
      b.textContent = r.texte;
      b.onclick = () => repondre(r, b);
      blocChoix.appendChild(b);
    });
  }

  function repondre(reponse, boutonClique) {
    const q = serie[numero];
    zone.querySelectorAll(".choix button").forEach((b, i) => {
      b.disabled = true;
      if (q.reponses[i].juste) b.classList.add("juste");
    });

    if (reponse.juste) score++;
    else { boutonClique.classList.add("faux"); erreurs.push(q); }

    const expl = document.createElement("div");
    expl.className = "explication";
    expl.textContent = (reponse.juste ? "✅ Bonne réponse. " : "❌ Raté. ") + q.explication;
    zone.appendChild(expl);

    const suivant = document.createElement("button");
    suivant.className = "bouton";
    suivant.textContent = numero + 1 < serie.length ? "Question suivante →" : "Voir mon score";
    suivant.onclick = () => {
      numero++;
      if (numero < serie.length) afficherQuestion();
      else afficherBilan();
    };
    zone.appendChild(suivant);
  }

  function afficherBilan() {
    const pourcent = Math.round((score / serie.length) * 100);
    let message = "Continue, ça va venir.";
    if (pourcent >= 80) message = "Excellent, tu maîtrises.";
    else if (pourcent >= 50) message = "Pas mal, revois les erreurs ci-dessous.";

    zone.innerHTML =
      '<p class="score">' + score + " / " + serie.length + " (" + pourcent + " %)</p>" +
      '<p class="doux">' + message + "</p>";

    if (erreurs.length > 0) {
      const titre = document.createElement("h3");
      titre.textContent = "À revoir";
      const liste = document.createElement("ul");
      liste.className = "erreurs";
      erreurs.forEach(q => {
        const li = document.createElement("li");
        li.innerHTML = "<strong></strong><br><span class='doux'></span>";
        li.querySelector("strong").textContent = q.question;
        li.querySelector("span").textContent = q.explication;
        liste.appendChild(li);
      });
      zone.append(titre, liste);
    }

    const rejouer = document.createElement("button");
    rejouer.className = "bouton";
    rejouer.textContent = "Recommencer";
    rejouer.onclick = demarrer;
    zone.appendChild(rejouer);
  }

  // ---------------- Navigation ----------------
  // L'adresse qcm.html#U5 ouvre directement l'épreuve U5 :
  // pratique pour mettre un lien précis sous une vidéo.
  function selonAdresse() {
    const code = location.hash.slice(1);
    if (code) ouvrirEpreuve(code); else afficherEpreuves();
  }
  document.getElementById("retour").onclick = () => { history.pushState("", "", "qcm.html"); afficherEpreuves(); };
  window.addEventListener("hashchange", selonAdresse);
  selonAdresse();
</script>
</body>
</html>
