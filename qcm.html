<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="QCM du BTS Opticien-Lunetier classés par épreuve : analyse de la vision, optique géométrique et physique, ETSO, mathématiques. Corrigés et expliqués.">
<title>QCM BTS OL par épreuve · Opticonversion</title>
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23d9b26f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23d9b26f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="entete">
  <a class="logo" href="index.html" aria-label="Opticonversion, accueil">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#d9b26f" stroke-width="2.5"/><circle cx="16" cy="16" r="5.5" fill="#d9b26f"/><circle cx="18.5" cy="13.5" r="1.6" fill="#0b0d12"/></svg>
    <span>Opticonversion</span>
  </a>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="qcm.html" class="actif">QCM</a>
    <a href="calculateurs.html">Calculs</a>
  </nav>
</header>
<main>
  <h1 id="titre" class="apparait">QCM du BTS OL</h1>
  <p class="sous-titre" id="sous-titre">Choisis une épreuve. Les questions reprennent ce qui tombe le plus souvent à l'examen.</p>

  <div id="ecran-epreuves" class="epreuves"></div>

  <div id="ecran-qcm" hidden>
    <div class="barre-outils">
      <button class="retour" id="retour">← Toutes les épreuves</button>
      <!-- Le choix de la vue : QCM seul, Shorts + QCM, ou Shorts seuls -->
      <div class="vues" role="group" aria-label="Affichage">
        <button data-vue="qcm">QCM</button>
        <button data-vue="deux">Shorts + QCM</button>
        <button data-vue="shorts">Shorts</button>
      </div>
    </div>

    <div class="disposition vue-deux" id="disposition">
      <aside class="colonne-shorts">
        <div class="lecteur" id="lecteur" hidden></div>
        <p class="titre-colonne">▶ Les Shorts</p>
        <div class="liste-shorts" id="liste-shorts"></div>
      </aside>
      <div class="colonne-qcm">
        <div class="themes" id="themes"></div>
        <section id="zone"></section>
      </div>
    </div>
  </div>
</main>

<!-- On charge d'abord les questions et les vidéos, puis le moteur qui les affiche -->
<script src="videos.js"></script>
<script src="epreuves.js"></script>
<script src="questions-U41.js"></script>
<script src="questions-U42.js"></script>
<script src="questions-U43.js"></script>
<script src="questions-U5.js"></script>
<script src="questions-U3.js"></script>
<script>
  // ---------------- L'état du QCM ----------------
  let epreuveChoisie = null;   // ex. "U5"
  let themeChoisi = "Tous";
  let serie = [];              // les questions de la partie, mélangées
  let numero = 0;
  let score = 0;
  let erreurs = [];

  const zone = document.getElementById("zone");

  function melanger(liste) {
    const copie = liste.slice();
    for (let i = copie.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copie[i], copie[j]] = [copie[j], copie[i]];
    }
    return copie;
  }

  const questionsDe = code => QUESTIONS.filter(q => q.epreuve === code);

  // ---------------- Écran 1 : choisir une épreuve ----------------
  function afficherEpreuves() {
    epreuveChoisie = null;
    document.getElementById("ecran-qcm").hidden = true;
    document.getElementById("titre").textContent = "QCM du BTS OL";
    document.getElementById("sous-titre").textContent =
      "Choisis une épreuve. Les questions reprennent ce qui tombe le plus souvent à l'examen.";

    const conteneur = document.getElementById("ecran-epreuves");
    conteneur.hidden = false;
    conteneur.innerHTML = "";

    EPREUVES.forEach(e => {
      const nb = questionsDe(e.code).length;
      const b = document.createElement("button");
      b.className = "epreuve";
      b.disabled = nb === 0;
      b.innerHTML = '<span class="code"></span><span class="nom"></span><span class="info"></span>';
      b.querySelector(".code").textContent = e.code + (e.court ? " · " + e.court : "");
      b.querySelector(".nom").textContent = e.nom;
      b.querySelector(".info").textContent = e.detail + " · " + (nb > 0 ? nb + " questions" : "bientôt");
      b.onclick = () => { location.hash = e.code; };
      conteneur.appendChild(b);
    });
  }

  // ---------------- Écran 2 : le QCM d'une épreuve ----------------
  function ouvrirEpreuve(code, theme) {
    const e = EPREUVES.find(x => x.code === code);
    if (!e || questionsDe(code).length === 0) { afficherEpreuves(); return; }

    const themes = new Set(questionsDe(code).map(q => q.theme));
    epreuveChoisie = code;
    themeChoisi = theme && themes.has(theme) ? theme : "Tous";
    document.getElementById("ecran-epreuves").hidden = true;
    document.getElementById("ecran-qcm").hidden = false;
    document.querySelector("main").classList.add("large");
    document.getElementById("titre").textContent = e.nom;
    document.getElementById("sous-titre").textContent = e.code + " · " + e.detail;
    document.getElementById("lecteur").hidden = true;
    document.getElementById("lecteur").innerHTML = "";
    afficherThemes();
    demarrer();
  }

  // Choisir un thème : met à jour les pastilles, les Shorts, l'adresse, et relance le QCM
  function choisirTheme(t) {
    themeChoisi = t;
    const adresse = "#" + epreuveChoisie + (t === "Tous" ? "" : "/" + encodeURIComponent(t));
    history.replaceState(null, "", adresse);
    afficherThemes();
    demarrer();
  }

  function afficherThemes() {
    const qs = questionsDe(epreuveChoisie);
    const themes = ["Tous", ...new Set(qs.map(q => q.theme))];
    const conteneur = document.getElementById("themes");
    conteneur.innerHTML = "";
    themes.forEach(t => {
      const nb = t === "Tous" ? qs.length : qs.filter(q => q.theme === t).length;
      const b = document.createElement("button");
      b.className = "theme" + (t === themeChoisi ? " actif" : "");
      b.textContent = t + " (" + nb + ")";
      b.onclick = () => choisirTheme(t);
      conteneur.appendChild(b);
    });
    afficherShorts();
  }

  // ---------------- Les Shorts ----------------
  function lienVideo(theme) {
    return (typeof VIDEOS !== "undefined" && VIDEOS[epreuveChoisie + "/" + theme]) || "";
  }

  // Transforme un lien YouTube (shorts, watch, youtu.be) en lecteur intégrable.
  // youtube-nocookie = version sans cookies publicitaires.
  function lecteurYouTube(url) {
    const m = url.match(/(?:shorts\/|watch\?v=|youtu\.be\/|embed\/)([\w-]{11})/);
    return m ? "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&rel=0" : "";
  }

  function afficherShorts() {
    const qs = questionsDe(epreuveChoisie);
    const themes = [...new Set(qs.map(q => q.theme))];
    const liste = document.getElementById("liste-shorts");
    liste.innerHTML = "";
    themes.forEach(t => {
      const url = lienVideo(t);
      const b = document.createElement("button");
      b.className = "short" + (t === themeChoisi ? " actif" : "") + (url ? "" : " a-venir");
      b.innerHTML = '<span class="vignette">' + (url ? "▶" : "◷") + '</span><span class="texte"><strong></strong><small></small></span>';
      b.querySelector("strong").textContent = t;
      b.querySelector("small").textContent = (url ? "" : "vidéo bientôt · ") + qs.filter(q => q.theme === t).length + " questions";
      b.onclick = () => { jouerShort(t); if (themeChoisi !== t) choisirTheme(t); };
      liste.appendChild(b);
    });
  }

  // Lance la vidéo d'un thème dans le lecteur (sans toucher au QCM)
  function jouerShort(theme) {
    const url = lienVideo(theme);
    const lecteur = document.getElementById("lecteur");
    lecteur.hidden = false;
    lecteur.innerHTML = "";
    const titre = document.createElement("p");
    titre.className = "lecteur-titre";
    titre.textContent = theme;
    const fermer = document.createElement("button");
    fermer.className = "lecteur-fermer";
    fermer.setAttribute("aria-label", "Fermer la vidéo");
    fermer.textContent = "✕";
    fermer.onclick = () => { lecteur.hidden = true; lecteur.innerHTML = ""; };

    let contenu;
    const integre = url && lecteurYouTube(url);
    if (integre) {
      contenu = document.createElement("iframe");
      contenu.src = integre;
      contenu.title = "Short : " + theme;
      contenu.allow = "autoplay; encrypted-media; picture-in-picture";
      contenu.allowFullscreen = true;
    } else if (url) {
      contenu = document.createElement("a");
      contenu.className = "bouton";
      contenu.href = url;
      contenu.target = "_blank";
      contenu.rel = "noopener";
      contenu.textContent = "Voir le Short sur TikTok ↗";
    } else {
      contenu = document.createElement("p");
      contenu.className = "doux";
      contenu.textContent = "Le Short sur ce thème arrive bientôt. En attendant, entraîne-toi avec les questions.";
    }
    lecteur.append(titre, fermer, contenu);
  }

  // ---------------- Le choix de la vue (QCM / Shorts + QCM / Shorts) ----------------
  // La préférence est retenue dans le navigateur de l'élève.
  function choisirVue(vue) {
    const dispo = document.getElementById("disposition");
    dispo.classList.remove("vue-qcm", "vue-deux", "vue-shorts");
    dispo.classList.add("vue-" + vue);
    document.querySelectorAll(".vues button").forEach(b => b.classList.toggle("actif", b.dataset.vue === vue));
    try { localStorage.setItem("vue", vue); } catch (e) {}
  }
  document.querySelectorAll(".vues button").forEach(b => b.onclick = () => choisirVue(b.dataset.vue));
  let vueRetenue = "deux";
  try { vueRetenue = localStorage.getItem("vue") || "deux"; } catch (e) {}
  choisirVue(["qcm", "deux", "shorts"].includes(vueRetenue) ? vueRetenue : "deux");

  function demarrer() {
    const qs = questionsDe(epreuveChoisie);
    const choisies = themeChoisi === "Tous" ? qs : qs.filter(q => q.theme === themeChoisi);
    serie = melanger(choisies).map(q => {
      const reponses = melanger(q.choix.map((texte, i) => ({ texte, juste: i === q.bonne })));
      return { ...q, reponses };
    });
    numero = 0;
    score = 0;
    erreurs = [];
    afficherQuestion();
  }

  function afficherQuestion() {
    const q = serie[numero];
    const pourcent = Math.round((numero / serie.length) * 100);
    let pastilleSession = "";
    if (q.session) {
      pastilleSession = q.session === "complément"
        ? '<span class="pastille">Complément</span>'
        : '<span class="pastille bts">Type BTS ' + q.session + "</span>";
    }
    zone.innerHTML =
      '<div class="barre"><div class="barre-remplie" style="width:' + pourcent + '%"></div></div>' +
      '<div class="progression"><span>Question ' + (numero + 1) + " / " + serie.length + "</span>" +
      '<span class="pastille"></span>' + pastilleSession +
      "<span>Score : " + score + "</span></div>" +
      '<p class="enonce"></p><div class="choix"></div>';
    zone.querySelector(".progression .pastille").textContent = q.theme;
    zone.querySelector(".enonce").textContent = q.question;

    const blocChoix = zone.querySelector(".choix");
    q.reponses.forEach((r, i) => {
      const b = document.createElement("button");
      b.textContent = r.texte;
      b.dataset.lettre = "ABCD"[i];
      b.onclick = () => repondre(r, b);
      blocChoix.appendChild(b);
    });
    rejouerAnimation(zone);
  }

  // Relance l'animation d'apparition (petit glissement) sur un élément
  function rejouerAnimation(el) {
    el.classList.remove("apparait");
    void el.offsetWidth;
    el.classList.add("apparait");
  }

  function repondre(reponse, boutonClique) {
    const q = serie[numero];
    const blocChoix = zone.querySelector(".choix");
    blocChoix.classList.add("repondu");
    blocChoix.querySelectorAll("button").forEach((b, i) => {
      b.disabled = true;
      if (q.reponses[i].juste) b.classList.add("juste");
    });

    if (reponse.juste) score++;
    else { boutonClique.classList.add("faux"); erreurs.push(q); }

    // La barre avance dès qu'on a répondu
    zone.querySelector(".barre-remplie").style.width = Math.round(((numero + 1) / serie.length) * 100) + "%";

    const expl = document.createElement("div");
    expl.className = "explication " + (reponse.juste ? "bien" : "mal");
    expl.innerHTML = "<strong></strong><span></span>";
    expl.querySelector("strong").textContent = reponse.juste ? "Bonne réponse" : "Pas tout à fait";
    expl.querySelector("span").textContent = q.explication;
    zone.appendChild(expl);

    // En cas d'erreur : un bouton pour revoir le Short du thème
    if (!reponse.juste) {
      const revoir = document.createElement("button");
      revoir.className = "bouton secondaire revoir";
      revoir.textContent = "▶ Revoir le Short « " + q.theme + " »";
      revoir.onclick = () => {
        if (document.getElementById("disposition").classList.contains("vue-qcm")) choisirVue("deux");
        jouerShort(q.theme);
        document.getElementById("lecteur").scrollIntoView({ behavior: "smooth", block: "nearest" });
      };
      expl.appendChild(revoir);
    }

    const suivant = document.createElement("button");
    suivant.className = "bouton";
    suivant.textContent = numero + 1 < serie.length ? "Question suivante →" : "Voir mon score";
    suivant.onclick = () => {
      numero++;
      if (numero < serie.length) afficherQuestion();
      else afficherBilan();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    zone.appendChild(suivant);
    suivant.focus({ preventScroll: true });
  }

  function afficherBilan() {
    const pourcent = Math.round((score / serie.length) * 100);
    let message = "Continue, ça va venir. Revois les points ci-dessous.";
    if (pourcent >= 80) message = "Excellent, tu maîtrises cette épreuve.";
    else if (pourcent >= 50) message = "Pas mal ! Revois les erreurs ci-dessous.";

    zone.innerHTML =
      '<div class="bilan">' +
      '<div class="anneau"><div class="anneau-int"><p class="score">0 %<small>' + score + " / " + serie.length + "</small></p></div></div>" +
      '<p class="doux"></p></div>';
    zone.querySelector(".bilan .doux").textContent = message;
    rejouerAnimation(zone);

    // L'anneau se remplit et le pourcentage monte petit à petit
    const anneau = zone.querySelector(".anneau");
    const texte = zone.querySelector(".score");
    const debut = performance.now();
    const duree = 900;
    function etape(t) {
      const avance = Math.min(1, (t - debut) / duree);
      const valeur = Math.round(pourcent * (1 - Math.pow(1 - avance, 3)));
      anneau.style.setProperty("--p", valeur);
      texte.firstChild.textContent = valeur + " %";
      if (avance < 1) requestAnimationFrame(etape);
    }
    requestAnimationFrame(etape);

    if (erreurs.length > 0) {
      const titre = document.createElement("h3");
      titre.textContent = "À revoir";
      const liste = document.createElement("ul");
      liste.className = "erreurs";
      erreurs.forEach(q => {
        const li = document.createElement("li");
        li.innerHTML = "<strong></strong><br><span class='doux'></span>";
        li.querySelector("strong").textContent = q.question;
        li.querySelector("span").textContent = q.explication;
        liste.appendChild(li);
      });
      zone.append(titre, liste);
    }

    const rejouer = document.createElement("button");
    rejouer.className = "bouton";
    rejouer.textContent = "Recommencer";
    rejouer.onclick = demarrer;
    zone.appendChild(rejouer);
  }

  // ---------------- Navigation ----------------
  // L'adresse qcm.html#U5 ouvre directement l'épreuve U5,
  // et qcm.html#U5/Worth ouvre directement le thème Worth :
  // c'est le lien à mettre sous chaque Short.
  function selonAdresse() {
    const [code, theme] = location.hash.slice(1).split("/");
    if (code) ouvrirEpreuve(code, theme ? decodeURIComponent(theme) : null);
    else afficherEpreuves();
  }
  document.getElementById("retour").onclick = () => {
    history.pushState("", "", "qcm.html");
    document.querySelector("main").classList.remove("large");
    afficherEpreuves();
  };
  window.addEventListener("hashchange", selonAdresse);
  selonAdresse();
</script>
</body>
</html>
