<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Cascade des soldes intermédiaires de gestion</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    @keyframes apparait { to { opacity: 1; } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; opacity: 1; }
      .trace { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <g class="anim" style="animation-delay:0.3s">
    <rect x="20" y="14" width="440" height="40" rx="8" fill="#9ec5ff" fill-opacity=".1" stroke="#9ec5ff" stroke-width="1.4"/>
    <text x="32" y="31" class="g" style="font-size:15px">Marge commerciale</text>
    <text x="32" y="48" class="p" style="font-size:13px">ventes − coût d'achat des marchandises vendues</text>
  </g>
  <g class="anim" style="animation-delay:0.7s">
    <rect x="30" y="60" width="420" height="40" rx="8" fill="#6fd3c4" fill-opacity=".1" stroke="#6fd3c4" stroke-width="1.4"/>
    <text x="42" y="77" class="g" style="font-size:15px">Valeur ajoutée</text>
    <text x="42" y="94" class="p" style="font-size:13px">− charges externes (loyer, crédit-bail…)</text>
  </g>
  <g class="anim" style="animation-delay:1.1s">
    <rect x="40" y="106" width="400" height="40" rx="8" fill="#f0c674" fill-opacity=".26" stroke="#f0c674" stroke-width="2.5"/>
    <text x="52" y="123" class="g" style="font-size:15px">EBE</text>
    <text x="52" y="140" class="p" style="font-size:13px;fill:#f3dcae">− impôts et taxes − CHARGES DE PERSONNEL</text>
  </g>
  <g class="anim" style="animation-delay:1.5s">
    <rect x="50" y="152" width="380" height="40" rx="8" fill="#c7a3ff" fill-opacity=".1" stroke="#c7a3ff" stroke-width="1.4"/>
    <text x="62" y="169" class="g" style="font-size:15px">Résultat d'exploitation</text>
    <text x="62" y="186" class="p" style="font-size:13px">− dotations aux amortissements</text>
  </g>
  <g class="anim" style="animation-delay:1.9s">
    <rect x="60" y="198" width="360" height="40" rx="8" fill="#9aa3b2" fill-opacity=".1" stroke="#9aa3b2" stroke-width="1.4"/>
    <text x="72" y="215" class="g" style="font-size:15px">RCAI</text>
    <text x="72" y="232" class="p" style="font-size:13px">± résultat financier (intérêts d'emprunt)</text>
  </g>
  <g class="anim" style="animation-delay:2.3s">
    <rect x="70" y="244" width="340" height="40" rx="8" fill="#d9b26f" fill-opacity=".1" stroke="#d9b26f" stroke-width="1.4"/>
    <text x="82" y="261" class="g" style="font-size:15px">Résultat net</text>
    <text x="82" y="278" class="p" style="font-size:13px">± exceptionnel − impôt sur les bénéfices</text>
  </g>
  <g class="anim" style="animation-delay:2.8s">
    <text x="240" y="312" text-anchor="middle" style="fill:#f3dcae">Le salaire d'un nouvel opticien baisse d'abord l'EBE,</text>
    <text x="240" y="332" text-anchor="middle" style="fill:#f3dcae">puis tous les soldes en dessous.</text>
  </g>
</svg>
