<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Bail commercial 3-6-9 : congé et révision du loyer tous les 3 ans</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    @keyframes apparait { to { opacity: 1; } }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; opacity: 1; }
      .trace { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <line x1="50" y1="160" x2="430" y2="160" stroke="#5b6270" stroke-width="3"/>
  <line x1="50.0" y1="150" x2="50.0" y2="170" stroke="#aab2c0" stroke-width="2"/>
  <text x="50.0" y="192" text-anchor="middle" class="g">0 ans</text>
  <line x1="92.2" y1="155" x2="92.2" y2="165" stroke="#aab2c0" stroke-width="1"/>
  <line x1="134.4" y1="155" x2="134.4" y2="165" stroke="#aab2c0" stroke-width="1"/>
  <line x1="176.7" y1="150" x2="176.7" y2="170" stroke="#aab2c0" stroke-width="2"/>
  <text x="176.7" y="192" text-anchor="middle" class="g">3 ans</text>
  <line x1="218.9" y1="155" x2="218.9" y2="165" stroke="#aab2c0" stroke-width="1"/>
  <line x1="261.1" y1="155" x2="261.1" y2="165" stroke="#aab2c0" stroke-width="1"/>
  <line x1="303.3" y1="150" x2="303.3" y2="170" stroke="#aab2c0" stroke-width="2"/>
  <text x="303.3" y="192" text-anchor="middle" class="g">6 ans</text>
  <line x1="345.6" y1="155" x2="345.6" y2="165" stroke="#aab2c0" stroke-width="1"/>
  <line x1="387.8" y1="155" x2="387.8" y2="165" stroke="#aab2c0" stroke-width="1"/>
  <line x1="430.0" y1="150" x2="430.0" y2="170" stroke="#aab2c0" stroke-width="2"/>
  <text x="430.0" y="192" text-anchor="middle" class="g">9 ans</text>
  <text x="50" y="40" class="p">Signature</text>
  <g class="anim" style="animation-delay:0.4s">
    <rect x="155.6" y="153" width="21.1" height="14" fill="#ff8a7a" fill-opacity=".45"/>
    <circle cx="176.7" cy="160" r="8" fill="#f0c674"/>
    <line x1="176.7" y1="148" x2="176.7" y2="98" stroke="#f0c674" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="176.7" y="90" text-anchor="middle" style="font-size:14px;fill:#f3dcae">congé possible</text>
    <text x="176.7" y="72" text-anchor="middle" style="font-size:14px;fill:#9ec5ff">révision du loyer</text>
  </g>
  <g class="anim" style="animation-delay:1.1s">
    <rect x="282.2" y="153" width="21.1" height="14" fill="#ff8a7a" fill-opacity=".45"/>
    <circle cx="303.3" cy="160" r="8" fill="#f0c674"/>
    <line x1="303.3" y1="148" x2="303.3" y2="98" stroke="#f0c674" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="303.3" y="90" text-anchor="middle" style="font-size:14px;fill:#f3dcae">congé possible</text>
    <text x="303.3" y="72" text-anchor="middle" style="font-size:14px;fill:#9ec5ff">révision du loyer</text>
  </g>
  <g class="anim" style="animation-delay:1.8s">
    <rect x="408.9" y="153" width="21.1" height="14" fill="#ff8a7a" fill-opacity=".45"/>
    <circle cx="430.0" cy="160" r="8" fill="#f0c674"/>
    <line x1="430.0" y1="148" x2="430.0" y2="60" stroke="#f0c674" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="444.0" y="52" text-anchor="end" style="font-size:14px;fill:#f3dcae">fin du bail</text>
    <text x="444.0" y="34" text-anchor="end" style="font-size:14px;fill:#9ec5ff">renouvellement</text>
  </g>
  <g class="anim" style="animation-delay:2.6s">
    <rect x="50" y="212" width="16" height="12" fill="#ff8a7a" fill-opacity=".45"/>
    <text x="74" y="223" class="p">préavis de 6 mois avant l'échéance</text>
    <text x="50" y="248" class="p">Bail dérogatoire : 3 ans maximum.</text>
  </g>
  <g class="anim" style="animation-delay:2.9s">
    <rect x="30" y="296" width="420" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">9 ans minimum · le locataire peut partir tous les 3 ans</text>
  </g>
</svg>
