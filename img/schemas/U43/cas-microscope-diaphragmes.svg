<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 262" role="img" aria-labelledby="t">
  <title id="t">Microscope : diaphragmes dans l'espace entre l'objectif et l'oculaire</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="mo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="262" fill="url(#grille)"/>
  <line x1="8" y1="140" x2="472" y2="140" stroke="#5b6270" stroke-width="1.5"/>
  <line x1="60" y1="90" x2="60" y2="120" stroke="#6fd3c4" stroke-width="4"/><line x1="60" y1="160" x2="60" y2="190" stroke="#6fd3c4" stroke-width="4"/>
  <line x1="437" y1="64" x2="437" y2="90" stroke="#c7a3ff" stroke-width="4"/><line x1="437" y1="190" x2="437" y2="216" stroke="#c7a3ff" stroke-width="4"/>
  <text x="52" y="80" class="g" style="fill:#6fd3c4">monture objectif</text>
  <text x="70" y="110" class="p">rayon 4 mm</text>
  <text x="470" y="56" text-anchor="end" class="g" style="fill:#c7a3ff">monture oculaire</text>
  <text x="427" y="82" text-anchor="end" class="p">rayon 10 mm</text>
  <line x1="372" y1="74" x2="372" y2="206" stroke="#aab2c0" stroke-width="1.6" stroke-dasharray="3 5"/>
  <circle cx="372" cy="140" r="5" fill="#f2f2f2"/><text x="364" y="132" text-anchor="end" class="g">A₁</text>
  <text x="364" y="202" text-anchor="end" class="p">plan des champs</text>
  <line x1="60" y1="230" x2="372" y2="230" stroke="#aab2c0" stroke-width="1.2" marker-start="url(#mg)" marker-end="url(#mg)"/><text x="216" y="248" text-anchor="middle" class="p">120 mm</text>
  <line x1="372" y1="230" x2="437" y2="230" stroke="#aab2c0" stroke-width="1.2" marker-start="url(#mg)" marker-end="url(#mg)"/><text x="404.5" y="248" text-anchor="middle" class="p">25 mm</text>
  <text x="470" y="22" text-anchor="end" style="font-size:13px;fill:#7f8899">échelle transversale ≈ 2 × l'axiale</text>
</svg>
