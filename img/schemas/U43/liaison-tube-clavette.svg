<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Tube guidé dans un support par une clavette dans une rainure</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 14px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="mo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="300" fill="url(#grille)"/>
  <text x="120.0" y="22.0" text-anchor="middle" class="p">coupe transversale</text>
  <circle cx="120" cy="150" r="82" fill="#aab2c0" fill-opacity=".10" stroke="#aab2c0" stroke-width="3"/>
  <circle cx="120" cy="150" r="62" fill="#0f1219" stroke="#6fd3c4" stroke-width="3"/>
  <circle cx="120" cy="150" r="62" fill="#6fd3c4" fill-opacity=".14"/>
  <rect x="111" y="66" width="18" height="30" fill="#f0c674" fill-opacity=".55" stroke="#f0c674" stroke-width="2.2"/>
  <text x="150.0" y="58.0" text-anchor="start" class="p" style="fill:#f0c674">clavette</text>
  <text x="120.0" y="258.0" text-anchor="middle" class="p" style="fill:#aab2c0">support</text>
  <text x="120.0" y="154.0" text-anchor="middle" class="g" style="fill:#6fd3c4">tube</text>
  <text x="350.0" y="22.0" text-anchor="middle" class="p">coupe longitudinale</text>
  <rect x="270" y="60" width="26" height="190" fill="#aab2c0" fill-opacity=".10" stroke="#aab2c0" stroke-width="3"/>
  <rect x="404" y="60" width="26" height="190" fill="#aab2c0" fill-opacity=".10" stroke="#aab2c0" stroke-width="3"/>
  <rect x="310" y="40" width="80" height="230" fill="#6fd3c4" fill-opacity=".14" stroke="#6fd3c4" stroke-width="3"/>
  <rect x="296" y="120" width="26" height="14" fill="#f0c674" fill-opacity=".55" stroke="#f0c674" stroke-width="2.2"/>
  <line x1="310.0" y1="104.0" x2="310.0" y2="196.0" stroke="#f0c674" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="322.0" y1="104.0" x2="322.0" y2="196.0" stroke="#f0c674" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="262.0" y="76.0" text-anchor="end" class="p" style="fill:#aab2c0">support</text>
  <text x="350.0" y="154.0" text-anchor="middle" class="g" style="fill:#6fd3c4">tube</text>
  <text x="350.0" y="286.0" text-anchor="middle" class="p" style="fill:#f0c674">rainure (pointillés) dans le tube</text>
  <g transform="translate(446 266)">  <line x1="0.0" y1="0.0" x2="0.0" y2="-44.0" stroke="#e7e9ee" stroke-width="2" marker-end="url(#mg)"/>
  <text x="8.0" y="-36.0" text-anchor="start" class="g">Z</text>
</g>
</svg>
