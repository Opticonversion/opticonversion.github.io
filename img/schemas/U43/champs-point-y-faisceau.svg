<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="t">
  <title id="t">Le faisceau issu d'un point Y du plan des champs</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="mo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="290" fill="url(#grille)"/>
  <line x1="8" y1="160" x2="472" y2="160" stroke="#5b6270" stroke-width="1.5"/>
  <line x1="50" y1="47.5" x2="50" y2="260" stroke="#aab2c0" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="20" y="278" class="p">plan des champs</text>
  <path d="M50 103.8 L425 97.5 L425 222.5 Z" fill="#aab2c0" fill-opacity=".08" stroke="#aab2c0" stroke-opacity=".5" stroke-dasharray="4 4"/>
  <path d="M50 103.8 L425 135 L425 222.5 Z" fill="#f0c674" fill-opacity=".28" stroke="#f0c674" stroke-width="2"/>
  <line x1="200" y1="82.2" x2="200" y2="116.2" stroke="#6fd3c4" stroke-width="4"/><line x1="200" y1="203.8" x2="200" y2="237.8" stroke="#6fd3c4" stroke-width="4"/>
  <text x="200" y="74.2" text-anchor="middle" class="g" style="fill:#6fd3c4">lucarne</text>
  <line x1="425" y1="67.5" x2="425" y2="97.5" stroke="#c7a3ff" stroke-width="4"/><line x1="425" y1="222.5" x2="425" y2="252.5" stroke="#c7a3ff" stroke-width="4"/>
  <text x="425" y="59.5" text-anchor="middle" class="g" style="fill:#c7a3ff">pupille</text>
  <circle cx="50" cy="103.8" r="5.5" fill="#f2f2f2"/><text x="41" y="109.8" text-anchor="end" class="g">Y</text>
  <text x="470" y="22" text-anchor="end" style="font-size:13px;fill:#7f8899">en or : la lumière qui atteint la pupille</text>
  <text x="470" y="40" text-anchor="end" style="font-size:13px;fill:#7f8899">en pointillé : le cône complet vers la pupille</text>
</svg>
