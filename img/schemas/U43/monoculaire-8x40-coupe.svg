<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Monoculaire 8×40, coupe simplifiée</title>
  <desc id="d">Coupe le long de l'axe optique X. De gauche à droite : le corps 1 et le barillet 2 qui tient l'objectif (doublet collé), les prismes de Porro dessinés dépliés, le diaphragme de champ au foyer image de l'objectif, à 200 mm, puis la bague de mise au point 3, le porte-oculaire 4 avec son filetage et l'ergot du corps, l'oculaire 5 à 25 mm du diaphragme, l'œilleton et le cercle oculaire, 28 mm après l'oculaire. Schéma hors échelle en hauteur.</desc>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; fill: #e7e9ee; }
    .p { font-size: 13px; fill: #aab2c0; }
    .n { font-size: 14px; font-weight: 700; fill: #0f1219; }
    .piece { fill: #aab2c0; fill-opacity: .22; stroke: #aab2c0; stroke-width: 1.6; }
    .bague { fill: #d9b26f; fill-opacity: .22; stroke: #d9b26f; stroke-width: 1.6; }
    .porte { fill: #9ec5ff; fill-opacity: .2; stroke: #9ec5ff; stroke-width: 1.6; }
    .verre { fill: #9ec5ff; fill-opacity: .28; stroke: #cfe2ff; stroke-width: 1.6; }
    .trait { fill: none; stroke: #aab2c0; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="fl" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
  </defs>

  <!-- Axe optique X -->
  <line x1="20" y1="150" x2="640" y2="150" stroke="#e7e9ee" stroke-opacity=".5" stroke-width="1" stroke-dasharray="10 4 2 4"/>
  <line x1="600" y1="150" x2="640" y2="150" stroke="#e7e9ee" stroke-width="1.4" marker-end="url(#fl)"/>
  <text x="646" y="155">X</text>

  <!-- 1 Corps : paroi, butée de la bague, manchon arrière qui porte le diaphragme et l'ergot -->
  <path class="piece" d="M40 80 H436 V96 H432 V88 H40 Z"/>
  <path class="piece" d="M40 220 H436 V204 H432 V212 H40 Z"/>
  <path class="piece" d="M424 88 H432 V106 H495 V112 H424 Z"/>
  <path class="piece" d="M424 212 H432 V194 H495 V188 H424 Z"/>
  <!-- ergot du corps dans la rainure droite du porte-oculaire -->
  <rect x="466" y="101" width="8" height="5" fill="#e7e9ee"/>

  <!-- 2 Barillet de l'objectif -->
  <path class="piece" d="M44 88 H82 V96 H76 V93 H50 V96 H44 Z"/>
  <path class="piece" d="M44 212 H82 V204 H76 V207 H50 V204 H44 Z"/>
  <!-- Objectif : crown biconvexe collé à un flint -->
  <path class="verre" d="M58 92 Q74 150 58 208 Q46 150 58 92 Z"/>
  <path class="verre" d="M62 94 L74 94 Q68 150 74 206 L62 206 Q72 150 62 94 Z"/>

  <!-- Prismes de Porro, dessinés dépliés -->
  <rect x="200" y="106" width="130" height="88" rx="4" fill="#9ec5ff" fill-opacity=".1" stroke="#cfe2ff" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="265" y="134" text-anchor="middle" class="p">prismes de Porro</text>
  <text x="265" y="176" text-anchor="middle" class="p">(dessinés dépliés)</text>

  <!-- Diaphragme de champ, au foyer image de l'objectif -->
  <rect x="458" y="112" width="4" height="17" fill="#e7e9ee"/>
  <rect x="458" y="171" width="4" height="17" fill="#e7e9ee"/>

  <!-- 3 Bague de mise au point (moletée) -->
  <path class="bague" d="M440 82 H506 V95 H440 Z"/>
  <path class="bague" d="M440 218 H506 V205 H440 Z"/>
  <path d="M448 82 V95 M456 82 V95 M464 82 V95 M472 82 V95 M480 82 V95 M488 82 V95 M496 82 V95" stroke="#d9b26f" stroke-opacity=".6" stroke-width="1"/>
  <path d="M448 218 V205 M456 218 V205 M464 218 V205 M472 218 V205 M480 218 V205 M488 218 V205 M496 218 V205" stroke="#d9b26f" stroke-opacity=".6" stroke-width="1"/>

  <!-- 4 Porte-oculaire : filetage extérieur (pas 2 mm) dans la bague, rebord qui tient l'oculaire -->
  <path class="porte" d="M440 96 H526 V114 H518 V104 H440 Z"/>
  <path class="porte" d="M440 204 H526 V186 H518 V196 H440 Z"/>
  <path d="M444 95.5 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l2 1.5" fill="none" stroke="#e7e9ee" stroke-width="1"/>
  <path d="M444 204.5 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l4 -3 l4 3 l2 -1.5" fill="none" stroke="#e7e9ee" stroke-width="1"/>

  <!-- 5 Oculaire -->
  <path class="verre" d="M510 114 Q522 150 510 186 Q498 150 510 114 Z"/>

  <!-- Œilleton rabattable -->
  <path d="M526 96 Q548 94 548 112 L540 112 Q540 104 526 104 Z" fill="#5a5f6b" stroke="#aab2c0" stroke-width="1.2"/>
  <path d="M526 204 Q548 206 548 188 L540 188 Q540 196 526 196 Z" fill="#5a5f6b" stroke="#aab2c0" stroke-width="1.2"/>

  <!-- Cercle oculaire -->
  <line x1="566" y1="142" x2="566" y2="158" stroke="#f0c674" stroke-width="3" stroke-linecap="round"/>

  <!-- Repères des pièces -->
  <g>
    <line x1="150" y1="84" x2="150" y2="50" class="trait"/><circle cx="150" cy="40" r="11" fill="#e7e9ee"/><text x="150" y="45" text-anchor="middle" class="n">1</text>
    <line x1="64" y1="91" x2="64" y2="50" class="trait"/><circle cx="64" cy="40" r="11" fill="#e7e9ee"/><text x="64" y="45" text-anchor="middle" class="n">2</text>
    <line x1="490" y1="82" x2="490" y2="50" class="trait"/><circle cx="490" cy="40" r="11" fill="#d9b26f"/><text x="490" y="45" text-anchor="middle" class="n">3</text>
    <line x1="522" y1="98" x2="545" y2="58" class="trait"/><circle cx="552" cy="46" r="11" fill="#9ec5ff"/><text x="552" y="51" text-anchor="middle" class="n">4</text>
    <line x1="512" y1="186" x2="530" y2="250" class="trait"/><circle cx="534" cy="262" r="11" fill="#cfe2ff"/><text x="534" y="267" text-anchor="middle" class="n">5</text>
  </g>

  <!-- Légendes sans numéro -->
  <line x1="470" y1="101" x2="400" y2="62" class="trait"/><text x="396" y="58" text-anchor="end" class="p">ergot du corps</text>
  <line x1="460" y1="186" x2="430" y2="262" class="trait"/><text x="430" y="278" text-anchor="middle" class="p">diaphragme de champ</text>
  <text x="430" y="294" text-anchor="middle" class="p">(14 mm)</text>
  <line x1="548" y1="194" x2="600" y2="226" class="trait"/><text x="604" y="230" class="p">œilleton</text>
  <line x1="566" y1="158" x2="610" y2="190" class="trait"/><text x="614" y="194" class="p">cercle oculaire</text>
  <text x="66" y="262" text-anchor="middle" class="p">objectif</text>
  <text x="66" y="278" text-anchor="middle" class="p">(doublet collé)</text>
  <line x1="66" y1="206" x2="66" y2="248" class="trait"/>

  <!-- Cotes le long de l'axe -->
  <line x1="60" y1="318" x2="460" y2="318" stroke="#aab2c0" stroke-width="1.2" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="260" y="312" text-anchor="middle" class="p">200 mm (f' de l'objectif)</text>
  <line x1="460" y1="318" x2="510" y2="318" stroke="#aab2c0" stroke-width="1.2" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="485" y="340" text-anchor="middle" class="p">25 mm</text>
  <line x1="510" y1="318" x2="566" y2="318" stroke="#aab2c0" stroke-width="1.2" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="538" y="340" text-anchor="middle" class="p">28 mm</text>
  <path d="M60 300 V324 M460 300 V324 M510 300 V324 M566 300 V324" stroke="#aab2c0" stroke-opacity=".6" stroke-width="1"/>
</svg>
