<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Vue de gauche : champ de pleine lumière, champ moyen et champ total</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#lueur); }
    .v { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
    .lab { font-size: 15px; }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <linearGradient id="verre" x1="0" x2="1"><stop offset="0" stop-color="#9ec5ff" stop-opacity=".04"/><stop offset=".5" stop-color="#9ec5ff" stop-opacity=".3"/><stop offset="1" stop-color="#9ec5ff" stop-opacity=".04"/></linearGradient>
    <filter id="lueur" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="cadre"><rect x="0" y="0" width="480" height="262"/></clipPath>
    <marker id="mb" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f2f2f2"/></marker>
    <marker id="md" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b26f"/></marker>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="ml" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <radialGradient id="ecl" cx="140" cy="140" r="96.3" gradientUnits="userSpaceOnUse"><stop offset="0.000" stop-color="#f3dcae" stop-opacity="0.550"/><stop offset="0.273" stop-color="#f3dcae" stop-opacity="0.550"/><stop offset="0.360" stop-color="#f3dcae" stop-opacity="0.499"/><stop offset="0.447" stop-color="#f3dcae" stop-opacity="0.421"/><stop offset="0.491" stop-color="#f3dcae" stop-opacity="0.380"/><stop offset="0.567" stop-color="#f3dcae" stop-opacity="0.306"/><stop offset="0.636" stop-color="#f3dcae" stop-opacity="0.241"/><stop offset="0.720" stop-color="#f3dcae" stop-opacity="0.167"/><stop offset="0.807" stop-color="#f3dcae" stop-opacity="0.097"/><stop offset="0.895" stop-color="#f3dcae" stop-opacity="0.040"/><stop offset="0.960" stop-color="#f3dcae" stop-opacity="0.010"/><stop offset="1.000" stop-color="#f3dcae" stop-opacity="0.000"/></radialGradient>
  </defs>

  <rect x="0" y="0" width="480" height="262" fill="url(#grille)"/>
  <circle cx="140" cy="140" r="96.3" fill="url(#ecl)"/>
  <circle class="anim" style="animation-delay:.2s" cx="140" cy="140" r="26.2" fill="none" stroke="#5fd08a" stroke-width="2.5"/>
  <circle class="anim" style="animation-delay:.6s" cx="140" cy="140" r="61.3" fill="none" stroke="#c7a3ff" stroke-width="2" stroke-dasharray="6 5"/>
  <circle class="anim" style="animation-delay:1s" cx="140" cy="140" r="96.3" fill="none" stroke="#ff8a7a" stroke-width="2.5"/>
  <g class="anim" style="animation-delay:0.2s"><line x1="161.5" y1="124.9" x2="262" y2="52" stroke="#5fd08a" stroke-width="1.4"/><circle cx="161.5" cy="124.9" r="3.5" fill="#5fd08a"/><text x="270" y="57" class="g lab" style="fill:#5fd08a">Pleine lumière (PL)</text><text x="270" y="76" class="p">éclairement maximal, uniforme</text></g>
  <g class="anim" style="animation-delay:0.6s"><line x1="201" y1="145.3" x2="262" y2="128" stroke="#c7a3ff" stroke-width="1.4"/><circle cx="201" cy="145.3" r="3.5" fill="#c7a3ff"/><text x="270" y="133" class="g lab" style="fill:#c7a3ff">Champ moyen (M)</text><text x="270" y="152" class="p">environ la moitié (44 % ici)</text></g>
  <g class="anim" style="animation-delay:1s"><line x1="215.8" y1="199.3" x2="262" y2="204" stroke="#ff8a7a" stroke-width="1.4"/><circle cx="215.8" cy="199.3" r="3.5" fill="#ff8a7a"/><text x="270" y="209" class="g lab" style="fill:#ff8a7a">Champ total (T)</text><text x="270" y="228" class="p">l'éclairement tombe à 0</text></g>
  <g class="anim" style="animation-delay:1.6s">
    <text x="240" y="283" text-anchor="middle" class="p">éclairement calculé point par point (pupille ronde)</text>
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">Entre PL et T : champ de contour (vignettage)</text>
  </g>
</svg>
