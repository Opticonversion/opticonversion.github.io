<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Liaisons usuelles : mouvements possibles suivant l'axe X</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#lueur); }
    .v { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <linearGradient id="verre" x1="0" x2="1"><stop offset="0" stop-color="#9ec5ff" stop-opacity=".04"/><stop offset=".5" stop-color="#9ec5ff" stop-opacity=".3"/><stop offset="1" stop-color="#9ec5ff" stop-opacity=".04"/></linearGradient>
    <filter id="lueur" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="cadre"><rect x="0" y="0" width="480" height="270"/></clipPath>
    <marker id="mb" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f2f2f2"/></marker>
    <marker id="md" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b26f"/></marker>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="ml" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
  </defs>

  <rect x="0" y="0" width="480" height="270" fill="url(#grille)"/>
  <text x="20" y="34" class="g">Mouvements suivant l'axe X</text>
  <text x="236" y="70" text-anchor="middle" class="p">Translation</text><text x="330" y="70" text-anchor="middle" class="p">Rotation</text><text x="420" y="70" text-anchor="middle" class="p">ddl</text>
  <text x="236" y="52" text-anchor="middle" style="font-size:20px;fill:#6fd3c4">↔</text><text x="330" y="52" text-anchor="middle" style="font-size:20px;fill:#c7a3ff">⟳</text>
  <g class="anim" style="animation-delay:0.2s"><rect x="12" y="82" width="456" height="36" rx="10" fill="#ffffff" fill-opacity=".04" /><text x="24" y="106" class="g">Pivot</text><text x="236" y="106" text-anchor="middle" style="fill:#5b6270;font-weight:700">—</text><text x="330" y="106" text-anchor="middle" style="fill:#c7a3ff;font-weight:700">✓</text><text x="420" y="106" text-anchor="middle">1</text></g>
  <g class="anim" style="animation-delay:0.4s"><rect x="12" y="124" width="456" height="36" rx="10" fill="#ffffff" fill-opacity=".04" /><text x="24" y="148" class="g">Glissière</text><text x="236" y="148" text-anchor="middle" style="fill:#6fd3c4;font-weight:700">✓</text><text x="330" y="148" text-anchor="middle" style="fill:#5b6270;font-weight:700">—</text><text x="420" y="148" text-anchor="middle">1</text></g>
  <g class="anim" style="animation-delay:0.6s"><rect x="12" y="166" width="456" height="36" rx="10" fill="#d9b26f" fill-opacity=".16" stroke="#d9b26f" stroke-opacity=".6"/><text x="24" y="190" class="g">Pivot glissant</text><text x="236" y="190" text-anchor="middle" style="fill:#6fd3c4;font-weight:700">✓</text><text x="330" y="190" text-anchor="middle" style="fill:#c7a3ff;font-weight:700">✓</text><text x="420" y="190" text-anchor="middle">2</text></g>
  <g class="anim" style="animation-delay:0.8s"><rect x="12" y="208" width="456" height="36" rx="10" fill="#ffffff" fill-opacity=".04" /><text x="24" y="232" class="g">Hélicoïdale</text><text x="236" y="232" text-anchor="middle" style="fill:#6fd3c4;font-weight:700">✓</text><text x="330" y="232" text-anchor="middle" style="fill:#c7a3ff;font-weight:700">✓</text><text x="420" y="232" text-anchor="middle">1 (liées)</text></g>
  <text x="20" y="282" class="p">Hélicoïdale : on avance d'un pas à chaque tour.</text>
  <g class="anim" style="animation-delay:1.2s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">Pivot glissant : rotation ET translation indépendantes</text>
  </g>
</svg>
