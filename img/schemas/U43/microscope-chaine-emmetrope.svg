<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Microscope réglé pour un emmétrope : chaîne des conjugués</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#lueur); }
    .v { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <linearGradient id="verre" x1="0" x2="1"><stop offset="0" stop-color="#9ec5ff" stop-opacity=".04"/><stop offset=".5" stop-color="#9ec5ff" stop-opacity=".3"/><stop offset="1" stop-color="#9ec5ff" stop-opacity=".04"/></linearGradient>
    <filter id="lueur" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="cadre"><rect x="0" y="0" width="480" height="262"/></clipPath>
    <marker id="mb" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f2f2f2"/></marker>
    <marker id="md" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b26f"/></marker>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="ml" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
  </defs>

  <rect x="0" y="0" width="480" height="262" fill="url(#grille)"/>
  <line x1="8" y1="150" x2="472" y2="150" stroke="#5b6270" stroke-width="1.5"/>
  <path d="M88 102 Q100 150 88 198 Q76 150 88 102 Z" fill="url(#verre)"/><line x1="88" y1="98" x2="88" y2="202" stroke="#9ec5ff" stroke-width="2.5" marker-start="url(#ml)" marker-end="url(#ml)"/>
  <path d="M378 60.5 Q390 150 378 239.5 Q366 150 378 60.5 Z" fill="url(#verre)"/><line x1="378" y1="56.5" x2="378" y2="243.5" stroke="#9ec5ff" stroke-width="2.5" marker-start="url(#ml)" marker-end="url(#ml)"/>
  <text x="88" y="88" text-anchor="middle" class="p">objectif</text>
  <text x="378" y="32.5" text-anchor="middle" class="p">oculaire</text>
  <g fill="#e7e9ee"><circle cx="48" cy="150" r="3.5"/><circle cx="128" cy="150" r="3.5"/><circle cx="428" cy="150" r="3.5"/></g>
  <text x="56" y="172" text-anchor="middle" class="p">F₁</text>
  <text x="128" y="140" text-anchor="middle" class="p">F'₁</text>
  <text x="450" y="172" text-anchor="middle" class="p">F'oc</text>
  <g clip-path="url(#cadre)">
    <path class="r c1 trace" style="animation-delay:.3s" pathLength="1" d="M40 136 L88 136 L328 220 L378 237.5 L480 94.7"/>
    <path class="r c2 trace" style="animation-delay:1.2s" pathLength="1" d="M40 136 L328 220 L378 234.6 L480 91.8"/>
    <path class="r c3 trace" style="animation-delay:2.1s" pathLength="1" d="M40 136 L88 220 L378 220 L480 77.2"/>
  </g>
  <line x1="40" y1="150" x2="40" y2="138" stroke="#f2f2f2" stroke-width="3.5" marker-end="url(#mb)"/>
  <text x="34" y="172" class="g">A</text><text x="32" y="128" class="g">B</text>
  <g class="anim" style="animation-delay:3s"><line x1="328" y1="150" x2="328" y2="218" stroke="#d9b26f" stroke-width="3.5" marker-end="url(#md)"/><text x="320" y="142" text-anchor="end" class="g">A₁ = Foc</text><text x="320" y="226" text-anchor="end" class="g">B₁</text></g>
  <g>
    <rect x="138" y="6" width="226" height="76" rx="10" fill="#0f1219" fill-opacity=".85"/>
    <circle cx="152" cy="20" r="9" fill="#f0c674"/><text x="152" y="24.5" text-anchor="middle" class="num">1</text><text x="168" y="25" class="p">parallèle → par F'₁</text>
    <circle cx="152" cy="44" r="9" fill="#6fd3c4"/><text x="152" y="48.5" text-anchor="middle" class="num">2</text><text x="168" y="49" class="p">par O₁ → non dévié</text>
    <circle cx="152" cy="68" r="9" fill="#c7a3ff"/><text x="152" y="72.5" text-anchor="middle" class="num">3</text><text x="168" y="73" class="p">par F₁ → ressort parallèle</text>
  </g>
  <text x="474" y="257" text-anchor="end" class="p anim" style="animation-delay:3.3s">→ image à l'infini</text>
  <g class="anim" style="animation-delay:3.6s">
    <text x="240" y="283" text-anchor="middle" class="p">f'obj = 20 mm · OA = −24 mm · OA₁ = +120 mm · γobj = −5</text>
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">B₁ est dans le plan focal objet de l'oculaire</text>
  </g>
</svg>
