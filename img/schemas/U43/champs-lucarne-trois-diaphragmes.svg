<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t">
  <title id="t">Trois diaphragmes dans l'espace d'étude, rayons et distances au point A</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 14px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="mg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="mo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="300" fill="url(#grille)"/>
  <line x1="8.0" y1="150.0" x2="472.0" y2="150.0" stroke="#5b6270" stroke-width="1.5" />
  <line x1="40.0" y1="50.0" x2="40.0" y2="250.0" stroke="#aab2c0" stroke-width="1.6" stroke-dasharray="3 5"/>
  <circle cx="40" cy="150" r="5" fill="#f2f2f2"/>
  <text x="48.0" y="172.0" text-anchor="start" class="g">A</text>
  <text x="40.0" y="270.0" text-anchor="start" class="p">plan des champs</text>
  <line x1="136.0" y1="92.0" x2="136.0" y2="126.0" stroke="#6fd3c4" stroke-width="4.5" />
  <line x1="136.0" y1="174.0" x2="136.0" y2="208.0" stroke="#6fd3c4" stroke-width="4.5" />
  <text x="136.0" y="84.0" text-anchor="middle" class="g" style="fill:#6fd3c4">[D₁]</text>
  <text x="136.0" y="228.0" text-anchor="middle" class="p">r = 10 mm</text>
  <text x="136.0" y="244.0" text-anchor="middle" class="p">à 40 mm</text>
  <line x1="256.0" y1="80.0" x2="256.0" y2="114.0" stroke="#f0c674" stroke-width="4.5" />
  <line x1="256.0" y1="186.0" x2="256.0" y2="220.0" stroke="#f0c674" stroke-width="4.5" />
  <text x="256.0" y="72.0" text-anchor="middle" class="g" style="fill:#f0c674">[D₂]</text>
  <text x="256.0" y="240.0" text-anchor="middle" class="p">r = 15 mm</text>
  <text x="256.0" y="256.0" text-anchor="middle" class="p">à 90 mm</text>
  <line x1="400.0" y1="44.0" x2="400.0" y2="78.0" stroke="#c792ea" stroke-width="4.5" />
  <line x1="400.0" y1="222.0" x2="400.0" y2="256.0" stroke="#c792ea" stroke-width="4.5" />
  <text x="400.0" y="36.0" text-anchor="middle" class="g" style="fill:#c792ea">[D₃]</text>
  <text x="400.0" y="276.0" text-anchor="middle" class="p">r = 30 mm</text>
  <text x="400.0" y="292.0" text-anchor="middle" class="p">à 150 mm</text>
</svg>
