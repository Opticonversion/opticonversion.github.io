  <line x1="250.0" y1="140.0" x2="460.0" y2="140.0" stroke="#f0c674" stroke-width="2.4" />
  <line x1="20.0" y1="190.0" x2="100.0" y2="190.0" stroke="#f0c674" stroke-width="2.4" />
  <line x1="100.0" y1="190.0" x2="250.0" y2="160.0" stroke="#f0c674" stroke-width="2.4" />
