  <line x1="258.0" y1="94.0" x2="250.0" y2="100.0" stroke="#e7e9ee" stroke-width="2.6" />
  <line x1="242.0" y1="206.0" x2="250.0" y2="200.0" stroke="#e7e9ee" stroke-width="2.6" />
  <line x1="258.0" y1="206.0" x2="250.0" y2="200.0" stroke="#e7e9ee" stroke-width="2.6" />
  <text x="250.0" y="82.0" text-anchor="middle" class="p">oculaire</text>
  <circle cx="300" cy="150" r="3.5" fill="#aab2c0"/>
