<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Incidence de Brewster sur l'eau d'un lac (n = 1,33)</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#lueur); }
    .v { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .cote { stroke: #9aa3b2; stroke-width: 1.2; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <filter id="lueur" filterUnits="userSpaceOnUse" x="0" y="0" width="480" height="340"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ml" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <marker id="mi" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <marker id="mc" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b2"/></marker>
    <marker id="m1" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="m2" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6fd3c4"/></marker>
    <marker id="m3" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c7a3ff"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="262" fill="url(#grille)"/>
  <rect x="0" y="130" width="480" height="132" fill="#9ec5ff" fill-opacity=".1"/>
  <line x1="0" y1="130" x2="480" y2="130" stroke="#9ec5ff" stroke-width="2"/>
  <line class="cote" x1="240" y1="22" x2="240" y2="258" stroke-dasharray="4 4"/>
  <text x="10" y="120" class="p">air</text>
  <text x="10" y="154" class="p">eau  n = 1,33</text>
  <path class="r c1 trace" style="animation-delay:0.3s" pathLength="1" d="M128.1 45.9 L240 130" marker-end="url(#m1)"/>
  <path class="r c2 trace" style="animation-delay:1.3s" pathLength="1" d="M240 130 L351.9 45.9" marker-end="url(#m2)"/>
  <path class="r c3 trace" style="animation-delay:1.3s" pathLength="1" d="M240 130 L315.1 229.9" marker-end="url(#m3)"/>
  <path class="anim" style="animation-delay:2.3s" d="M240 86 A44 44 0 0 0 204.8 103.6" fill="none" stroke="#f0c674" stroke-width="1.8"/>
  <text x="128" y="80" class="g" style="fill:#f0c674">iB = 53,1°</text>
  <path class="anim" style="animation-delay:2.3s" d="M240 184 A54 54 0 0 0 272.5 173.2" fill="none" stroke="#c7a3ff" stroke-width="1.8"/>
  <text x="142" y="196" class="g" style="fill:#c7a3ff">r = 36,9°</text>
  <path class="anim" style="animation-delay:2.6s" d="M252.8 120.4 L262.4 133.2 L249.6 142.8" fill="none" stroke="#ff8a7a" stroke-width="2"/>
  <text x="268" y="160" class="g" style="fill:#ff8a7a">90°</text>
  <circle cx="290.4" cy="92.1" r="3" fill="#f2f2f2"/>
  <circle cx="312.7" cy="75.3" r="3" fill="#f2f2f2"/>
  <circle cx="335.1" cy="58.5" r="3" fill="#f2f2f2"/>
  <g>
    <rect x="300" y="150" width="174" height="76" rx="10" fill="#0f1219" fill-opacity=".85"/>
    <circle cx="314" cy="164" r="9" fill="#f0c674"/><text x="314" y="168.5" text-anchor="middle" class="num">1</text><text x="330" y="169" class="p">rayon incident</text>
    <circle cx="314" cy="188" r="9" fill="#6fd3c4"/><text x="314" y="192.5" text-anchor="middle" class="num">2</text><text x="330" y="193" class="p">reflet : polarisé (•)</text>
    <circle cx="314" cy="212" r="9" fill="#c7a3ff"/><text x="314" y="216.5" text-anchor="middle" class="num">3</text><text x="330" y="217" class="p">rayon réfracté</text>
  </g>
  <g class="anim" style="animation-delay:2.8s">
    <text x="240" y="283" text-anchor="middle" class="p">Réfléchi et réfracté sont perpendiculaires : iB + r = 90°</text>
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">tan iB = n = 1,33 → iB ≈ 53,1°</text>
  </g>
</svg>
