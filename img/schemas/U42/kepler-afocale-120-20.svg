<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-labelledby="t">
  <title id="t">Lunette de Kepler afocale</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #e7e9ee; }
    .petit { font-size: 12px; fill: #9aa3b2; }
    .axe { stroke: #5b6270; stroke-width: 1.5; }
    .lentille { stroke: #9ec5ff; stroke-width: 2.5; fill: none; }
    .rayon { stroke: #f0c674; stroke-width: 2; fill: none; }
    .virtuel { stroke: #f0c674; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; opacity: .7; }
    .objet { stroke: #f2f2f2; stroke-width: 3; }
    .image { stroke: #d9b26f; stroke-width: 3; }
    .cote { stroke: #9aa3b2; stroke-width: 1.2; }
    .alerte { stroke: #ff8a7a; fill: #ff8a7a; }
  </style>
  <defs>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f2f2f2"/></marker>
    <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b26f"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b2"/></marker>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
  </defs>
  <line class="axe" x1="20" y1="120" x2="585" y2="120"/>
  <line class="lentille" x1="90" y1="55" x2="90" y2="185" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="62" y="46">Objectif</text>
  <line class="lentille" x1="440" y1="95" x2="440" y2="145" marker-start="url(#fl)" marker-end="url(#fl)"/>
  <text x="414" y="86">Oculaire</text>
  <path class="rayon" d="M25 80 L90 80 L390 120 L440 126.7 L560 126.7" marker-end="url(#fo)"/>
  <path class="rayon" d="M25 160 L90 160 L390 120 L440 113.3 L560 113.3" marker-end="url(#fo)"/>
  <circle cx="390" cy="120" r="4" fill="#ff8a7a"/>
  <text x="330" y="106" class="petit" style="fill:#ff8a7a">F'ob = Foc</text>
  <line class="cote" x1="90" y1="205" x2="388" y2="205" marker-start="url(#fg)" marker-end="url(#fg)"/>
  <text x="196" y="222" class="petit">f'ob = 120 mm</text>
  <line class="cote" x1="392" y1="205" x2="440" y2="205" marker-start="url(#fg)" marker-end="url(#fg)"/>
  <text x="392" y="222" class="petit">f'oc = 20 mm</text>
  <line class="cote" x1="90" y1="240" x2="440" y2="240" marker-start="url(#fg)" marker-end="url(#fg)"/>
  <text x="196" y="256">e = 120 + 20 = 140 mm</text>
  <text x="470" y="160" class="petit">rayons parallèles</text>
  <text x="470" y="174" class="petit">en sortie (afocal)</text>
</svg>
