<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Lunette de Galilée afocale : f'1 = 90 mm, f'2 = −30 mm</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#lueur); }
    .v { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .cote { stroke: #9aa3b2; stroke-width: 1.2; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <filter id="lueur" filterUnits="userSpaceOnUse" x="0" y="0" width="480" height="340"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ml" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <marker id="mi" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <marker id="mc" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b2"/></marker>
    <marker id="m1" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="m2" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6fd3c4"/></marker>
    <marker id="m3" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c7a3ff"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="262" fill="url(#grille)"/>
  <line x1="8" y1="140" x2="472" y2="140" stroke="#5b6270" stroke-width="1.5"/>
  <line x1="50" y1="70" x2="50" y2="210" stroke="#9ec5ff" stroke-width="2.5" marker-start="url(#ml)" marker-end="url(#ml)"/>
  <line x1="266" y1="106" x2="266" y2="174" stroke="#9ec5ff" stroke-width="2.5" marker-start="url(#mi)" marker-end="url(#mi)"/>
  <text x="24" y="60" class="p">L1 (+)</text>
  <text x="242" y="96" class="p">L2 (−)</text>
  <path class="r c1 trace" style="animation-delay:0.3s" pathLength="1" d="M10 95 L50 95 L266 125 L466 125" marker-end="url(#m1)"/>
  <path class="v c1 anim" style="animation-delay:1.4s" d="M266 125 L374 140"/>
  <path class="r c2 trace" style="animation-delay:1.1s" pathLength="1" d="M10 185 L50 185 L266 155 L466 155" marker-end="url(#m2)"/>
  <path class="v c2 anim" style="animation-delay:1.9s" d="M266 155 L374 140"/>
  <path class="r c3 trace" style="animation-delay:2.0s" pathLength="1" d="M10 138 L266 150.8 L466 180.8" marker-end="url(#m3)"/>
  <path class="v c3 anim" style="animation-delay:2.8s" d="M266 150.8 L374 156.2"/>
  <circle cx="374" cy="140" r="5" fill="#ff8a7a" class="anim" style="animation-delay:2.6s"/>
  <text x="344" y="110" class="g" style="fill:#ff8a7a;font-size:15px">F'1 = F2</text>
  <line class="cote" x1="52" y1="222" x2="372" y2="222" marker-start="url(#mc)" marker-end="url(#mc)"/>
  <text x="160" y="244" class="p">f'1 = 90 mm</text>
  <line class="cote" x1="268" y1="200" x2="372" y2="200" marker-start="url(#mc)" marker-end="url(#mc)"/>
  <text x="278" y="194" class="p" style="font-size:13px">|f'2| = 30</text>
  <g>
    <rect x="226" y="8" width="248" height="76" rx="10" fill="#0f1219" fill-opacity=".85"/>
    <circle cx="240" cy="22" r="9" fill="#f0c674"/><text x="240" y="26.5" text-anchor="middle" class="num">1</text><text x="256" y="27" class="p">vise F'1 → ressort parallèle</text>
    <circle cx="240" cy="46" r="9" fill="#6fd3c4"/><text x="240" y="50.5" text-anchor="middle" class="num">2</text><text x="256" y="51" class="p">vise F'1 → ressort parallèle</text>
    <circle cx="240" cy="70" r="9" fill="#c7a3ff"/><text x="240" y="74.5" text-anchor="middle" class="num">3</text><text x="256" y="75" class="p">incliné de α → sort à 3α</text>
  </g>
  <g class="anim" style="animation-delay:3.0s">
    <text x="240" y="283" text-anchor="middle" class="p">Image droite : G = −f'1 / f'2 = +3</text>
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">O1O2 = f'1 + f'2 = 90 + (−30) = 60 mm</text>
  </g>
  <g id="erreur" visibility="hidden">
    <line id="errligne" x1="0" y1="40" x2="0" y2="250" stroke="#ff8a7a" stroke-width="2.5" stroke-dasharray="5 5"/>
    <circle id="errpoint" cx="0" cy="0" r="6" fill="#ff8a7a" stroke="#0f1219" stroke-width="2"/>
    <text id="errtag" x="0" y="0" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#ff8a7a">ta réponse</text>
    <line x1="20" y1="346" x2="460" y2="346" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="32" cy="368" r="10" fill="#ff8a7a"/><text x="32" y="373" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#0f1219">✕</text>
    <text x="52" y="373" class="p">Ta réponse</text>
    <text id="errval" x="170" y="373" style="font-weight:700;fill:#ff8a7a"></text>
    <circle cx="32" cy="396" r="10" fill="#5fd08a"/><text x="32" y="401" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#0f1219">✓</text>
    <text x="52" y="401" class="p">Bonne réponse</text>
    <text x="170" y="401" style="font-weight:700;fill:#8fe0ad">60 mm</text>
    <text id="errpourquoi" x="20" y="432" style="font-size:15px;fill:#e7e9ee"></text>
  </g>
  <script><![CDATA[
  (function () {
    // Numéros = position de la réponse dans q.choix (questions-U42.js)
    var ERREURS = {"0": {"x": 482.0, "val": "120 mm", "pourquoi": "Tu as ajouté +30 : la focale d'un divergent est négative."}, "1": {"x": 158.0, "val": "30 mm", "pourquoi": "30 mm, c'est |f'2| seul : il faut f'1 + f'2."}, "3": {"x": 374.0, "val": "90 mm", "pourquoi": "À 90 mm, L2 serait sur F'1 : il faut f'1 + f'2."}};
    var m = /faux=(\d)/.exec(location.hash), e = m && ERREURS[m[1]];
    if (!e) return;
    var $ = function (id) { return document.getElementById(id); };
    document.documentElement.setAttribute("viewBox", "0 0 480 450");
    var x = e.x, dedans = x < 470;
    $("errligne").setAttribute("x1", dedans ? x : 472); $("errligne").setAttribute("x2", dedans ? x : 472);
    $("errpoint").setAttribute("cx", dedans ? x : 472); $("errpoint").setAttribute("cy", 140);
    $("errtag").setAttribute("x", dedans ? x : 470); $("errtag").setAttribute("y", 266);
    $("errtag").setAttribute("text-anchor", dedans ? "middle" : "end");
    $("errtag").textContent = dedans ? "L2 selon ta réponse" : "L2 plus loin →";
    $("errval").textContent = e.val;
    $("errpourquoi").textContent = "→ " + e.pourquoi;
    $("erreur").setAttribute("visibility", "visible");
  })();
  ]]></script>
</svg>
