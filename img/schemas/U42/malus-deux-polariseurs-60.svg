<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="t">
  <title id="t">Lumière naturelle à travers deux polariseurs à 60°</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #e7e9ee; }
    .petit { font-size: 12px; fill: #9aa3b2; }
    .axe { stroke: #5b6270; stroke-width: 1.5; }
    .lentille { stroke: #9ec5ff; stroke-width: 2.5; fill: none; }
    .rayon { stroke: #f0c674; stroke-width: 2; fill: none; }
    .virtuel { stroke: #f0c674; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; opacity: .7; }
    .objet { stroke: #f2f2f2; stroke-width: 3; }
    .image { stroke: #d9b26f; stroke-width: 3; }
    .cote { stroke: #9aa3b2; stroke-width: 1.2; }
    .alerte { stroke: #ff8a7a; fill: #ff8a7a; }
  </style>
  <defs>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f2f2f2"/></marker>
    <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b26f"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b2"/></marker>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 2 L5 8 L10 2" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
  </defs>
  <rect x="20" y="104" width="160" height="32" fill="#f0c674" fill-opacity=".55"/>
  <rect x="180" y="110" width="200" height="20" fill="#f0c674" fill-opacity=".4"/>
  <rect x="380" y="116" width="190" height="8" fill="#f0c674" fill-opacity=".35"/>
  <g stroke="#f2f2f2" stroke-width="2" marker-start="url(#fb)" marker-end="url(#fb)">
    <line x1="70" y1="70" x2="70" y2="40"/><line x1="55" y1="64" x2="85" y2="46"/><line x1="55" y1="46" x2="85" y2="64"/><line x1="52" y1="55" x2="88" y2="55"/>
  </g>
  <text x="26" y="96" class="petit">lumière naturelle</text>
  <text x="70" y="160">100 %</text>
  <circle cx="180" cy="120" r="48" fill="#0f1219" fill-opacity=".6" stroke="#9ec5ff" stroke-width="2"/>
  <line x1="180" y1="78" x2="180" y2="162" stroke="#9ec5ff" stroke-width="2.5"/>
  <text x="140" y="190" class="petit">polariseur 1</text>
  <line x1="280" y1="86" x2="280" y2="46" stroke="#f2f2f2" stroke-width="2" marker-start="url(#fb)" marker-end="url(#fb)"/>
  <text x="246" y="160">50 %</text>
  <text x="226" y="34" class="petit">une seule direction</text>
  <circle cx="380" cy="120" r="48" fill="#0f1219" fill-opacity=".6" stroke="#9ec5ff" stroke-width="2"/>
  <line x1="380" y1="78" x2="380" y2="162" stroke="#9ec5ff" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="343.6" y1="141.0" x2="416.4" y2="99.0" stroke="#9ec5ff" stroke-width="2.5"/>
  <path d="M380 92 A28 28 0 0 1 404.2 106.0" fill="none" stroke="#ff8a7a" stroke-width="2"/>
  <text x="392" y="88" style="fill:#ff8a7a">60°</text>
  <text x="340" y="190" class="petit">polariseur 2</text>
  <text x="440" y="150">50 % × cos² 60°</text>
  <text x="440" y="170">= 12,5 %</text>
</svg>
