<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t">
  <title id="t">Capteur 18 × 24 mm et champ de pleine lumière de rayon 14 mm</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #e7e9ee; }
    .petit { font-size: 12px; fill: #9aa3b2; }
    .axe { stroke: #5b6270; stroke-width: 1.5; }
    .lentille { stroke: #9ec5ff; stroke-width: 2.5; fill: none; }
    .rayon { stroke: #f0c674; stroke-width: 2; fill: none; }
    .virtuel { stroke: #f0c674; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; opacity: .7; }
    .objet { stroke: #f2f2f2; stroke-width: 3; }
    .image { stroke: #d9b26f; stroke-width: 3; }
    .cote { stroke: #9aa3b2; stroke-width: 1.2; }
    .alerte { stroke: #ff8a7a; fill: #ff8a7a; }
  </style>
  <defs>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f2f2f2"/></marker>
    <marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b26f"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b2"/></marker>
    <marker id="fl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 2 L5 8 L10 2" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
  </defs>
  <defs><mask id="hors"><rect x="0" y="0" width="600" height="300" fill="#fff"/><circle cx="200" cy="150" r="140" fill="#000"/></mask></defs>
  <circle cx="200" cy="150" r="140" fill="#f0c674" fill-opacity=".1" stroke="#f0c674" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="80" y="60" width="240" height="180" fill="none" stroke="#9ec5ff" stroke-width="2.5"/>
  <rect x="80" y="60" width="240" height="180" fill="#ff8a7a" fill-opacity=".55" mask="url(#hors)"/>
  <line x1="200" y1="150" x2="320" y2="60" stroke="#ff8a7a" stroke-width="2"/>
  <circle cx="200" cy="150" r="3.5" fill="#e7e9ee"/>
  <text x="252" y="96" style="fill:#ff8a7a">15 mm</text>
  <line x1="200" y1="150" x2="200" y2="10" class="cote" stroke-dasharray="3 4"/>
  <text x="206" y="30" class="petit">r = 14 mm</text>
  <text x="178" y="256" class="petit">24 mm</text>
  <text x="88" y="155" class="petit">18 mm</text>
  <text x="372" y="112">Demi-diagonale : √(9² + 12²)</text>
  <text x="372" y="132">= 15 mm, plus que 14 mm</text>
  <rect x="372" y="160" width="14" height="14" fill="#ff8a7a" fill-opacity=".55"/>
  <text x="394" y="172" class="petit">coins hors du champ :</text>
  <text x="394" y="188" class="petit">ils sont assombris</text>
  <line x1="372" y1="212" x2="390" y2="212" stroke="#f0c674" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="394" y="216" class="petit">champ de pleine lumière</text>
</svg>
