<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Antireflet monocouche : deux reflets en opposition de phase</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 17px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .r { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#lueur); }
    .v { fill: none; stroke-width: 1.8; stroke-dasharray: 6 6; opacity: .75; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .cote { stroke: #9aa3b2; stroke-width: 1.2; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <filter id="lueur" filterUnits="userSpaceOnUse" x="0" y="0" width="480" height="340"><feGaussianBlur stdDeviation="2.2" result="f"/><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ml" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <marker id="mi" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#9ec5ff" stroke-width="2"/></marker>
    <marker id="mc" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9aa3b2"/></marker>
    <marker id="m1" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="m2" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6fd3c4"/></marker>
    <marker id="m3" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c7a3ff"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="262" fill="url(#grille)"/>
  <rect x="0" y="112" width="262" height="60" fill="#c7a3ff" fill-opacity=".12"/>
  <rect x="0" y="172" width="262" height="90" fill="#9ec5ff" fill-opacity=".14"/>
  <line x1="0" y1="112" x2="262" y2="112" stroke="#c7a3ff" stroke-width="1.5"/><line x1="0" y1="172" x2="262" y2="172" stroke="#9ec5ff" stroke-width="2"/>
  <text x="10" y="104" class="p">air</text>
  <text x="10" y="148" class="p">couche n = 1,30</text>
  <text x="10" y="200" class="p">verre n = 1,69</text>
  <path class="r c1 trace" style="animation-delay:0.2s" pathLength="1" d="M56.9 21.9 L120 112"/>
  <path class="r c1 trace" style="animation-delay:1.1s" pathLength="1" d="M120 112 L183.1 21.9" marker-end="url(#m1)"/>
  <path class="r c2 trace" style="animation-delay:1.1s" pathLength="1" d="M120 112 L149.5 172 L179 112 L242.1 21.9" marker-end="url(#m2)"/>
  <text x="159.1" y="15.9" class="g" style="fill:#f0c674">①</text>
  <text x="232.1" y="15.9" class="g" style="fill:#6fd3c4">②</text>
  <line class="cote" x1="195.5" y1="114" x2="195.5" y2="170" marker-start="url(#mc)" marker-end="url(#mc)"/>
  <text x="203.5" y="148" class="g">e</text>
  <path class="r trace" style="animation-delay:2.0s;stroke:#f0c674" pathLength="1" d="M300 150 L304 147.2 L308 144.7 L312 142.7 L316 141.4 L320 141 L324 141.4 L328 142.7 L332 144.7 L336 147.2 L340 150 L344 152.8 L348 155.3 L352 157.3 L356 158.6 L360 159 L364 158.6 L368 157.3 L372 155.3 L376 152.8 L380 150 L384 147.2 L388 144.7 L392 142.7 L396 141.4 L400 141 L404 141.4 L408 142.7 L412 144.7 L416 147.2 L420 150 L424 152.8 L428 155.3 L432 157.3 L436 158.6 L440 159 L444 158.6 L448 157.3 L452 155.3 L456 152.8 L460 150"/>
  <text x="272" y="156" class="g" style="fill:#f0c674">①</text>
  <path class="r trace" style="animation-delay:2.4s;stroke:#6fd3c4" pathLength="1" d="M300 190 L304 192.8 L308 195.3 L312 197.3 L316 198.6 L320 199 L324 198.6 L328 197.3 L332 195.3 L336 192.8 L340 190 L344 187.2 L348 184.7 L352 182.7 L356 181.4 L360 181 L364 181.4 L368 182.7 L372 184.7 L376 187.2 L380 190 L384 192.8 L388 195.3 L392 197.3 L396 198.6 L400 199 L404 198.6 L408 197.3 L412 195.3 L416 192.8 L420 190 L424 187.2 L428 184.7 L432 182.7 L436 181.4 L440 181 L444 181.4 L448 182.7 L452 184.7 L456 187.2 L460 190"/>
  <text x="272" y="196" class="g" style="fill:#6fd3c4">②</text>
  <line class="anim" style="animation-delay:3s" x1="300" y1="230" x2="460" y2="230" stroke="#ff8a7a" stroke-width="2.6"/>
  <text x="250" y="236" class="g" style="fill:#ff8a7a;font-size:15px">① + ②</text>
  <text x="310" y="252" class="p" style="font-size:13px">≈ 0 : pas de reflet</text>
  <text x="296" y="24" class="g" style="font-size:16px">Décalage : 2·n·e = λ/2</text>
  <text x="296" y="46" class="p" style="font-size:13px">(angle et épaisseur exagérés)</text>
  <g class="anim" style="animation-delay:3.2s">
    <text x="240" y="283" text-anchor="middle" class="p">Les deux reflets sont en opposition de phase et s'annulent</text>
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">e = λ / (4 n) = 520 / (4 × 1,30) = 100 nm</text>
  </g>
</svg>
