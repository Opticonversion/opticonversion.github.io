<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Arbre pondéré : 40 % de verres progressifs, antireflet sur 75 % d'entre eux et sur 50 % des autres</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .ax { stroke: #5b6270; stroke-width: 1.5; fill: none; }
    .r { fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .tir { stroke-dasharray: 7 6; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1.4s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fl" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b6270" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="285" fill="url(#grille)"/>
  <path class="r trace" style="stroke:#f0c674;stroke-width:3;animation-delay:0.2s" pathLength="1" d="M44 145 L149 75"/>
  <text class="anim g" style="animation-delay:0.2s;fill:#f3dcae" x="98" y="100" text-anchor="middle">0,4</text>
  <path class="r trace" style="stroke:#f0c674;stroke-width:3;animation-delay:0.2s" pathLength="1" d="M44 145 L149 215"/>
  <text class="anim g" style="animation-delay:0.2s;fill:#f3dcae" x="98" y="200" text-anchor="middle">0,6</text>
  <path class="r trace" style="stroke:#f0c674;stroke-width:3;animation-delay:0.9s" pathLength="1" d="M179 75 L284 38"/>
  <text class="anim g" style="animation-delay:0.9s;fill:#f3dcae" x="232" y="46" text-anchor="middle">0,75</text>
  <path class="r trace" style="stroke:#5b6270;stroke-width:2;animation-delay:0.9s" pathLength="1" d="M179 75 L284 112"/>
  <text class="anim g" style="animation-delay:0.9s;fill:#aab2c0" x="232" y="114" text-anchor="middle">0,25</text>
  <path class="r trace" style="stroke:#f0c674;stroke-width:3;animation-delay:0.9s" pathLength="1" d="M179 215 L284 178"/>
  <text class="anim g" style="animation-delay:0.9s;fill:#f3dcae" x="232" y="186" text-anchor="middle">0,5</text>
  <path class="r trace" style="stroke:#5b6270;stroke-width:2;animation-delay:0.9s" pathLength="1" d="M179 215 L284 252"/>
  <text class="anim g" style="animation-delay:0.9s;fill:#aab2c0" x="232" y="254" text-anchor="middle">0,5</text>
  <text x="165" y="81" text-anchor="middle" class="g" style="font-size:18px">P</text>
  <text x="165" y="221" text-anchor="middle" class="g" style="font-size:18px">P̄</text>
  <text x="300" y="44" text-anchor="middle" class="g" style="font-size:18px">R</text>
  <text x="300" y="118" text-anchor="middle" class="g" style="font-size:18px">R̄</text>
  <text x="300" y="184" text-anchor="middle" class="g" style="font-size:18px">R</text>
  <text x="300" y="258" text-anchor="middle" class="g" style="font-size:18px">R̄</text>
  <circle cx="30" cy="145" r="5" fill="#e7e9ee"/>
  <text class="anim g" style="animation-delay:1.6s;fill:#f0c674" x="324" y="44">0,4 × 0,75 = 0,30</text>
  <text class="anim p" style="animation-delay:1.6s" x="324" y="118">0,10</text>
  <text class="anim g" style="animation-delay:1.8s;fill:#f0c674" x="324" y="184">0,6 × 0,5 = 0,30</text>
  <text class="anim p" style="animation-delay:1.8s" x="324" y="258">0,30</text>
  <g class="anim" style="animation-delay:2.4s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">P(R) = 0,30 + 0,30 = 0,60 (les deux chemins vers R)</text>
  </g>
</svg>
