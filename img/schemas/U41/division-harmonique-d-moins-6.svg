<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Division harmonique : A(0), B(6), C(2) et D(−6) ; relation de Newton avec I milieu de [AB]</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .num { font-size: 12px; font-weight: 800; fill: #0b0d12; }
    .ax { stroke: #5b6270; stroke-width: 1.5; fill: none; }
    .r { fill: none; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .c1 { stroke: #f0c674; } .c2 { stroke: #6fd3c4; } .c3 { stroke: #c7a3ff; }
    .tir { stroke-dasharray: 7 6; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1.4s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fl" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5b6270" stroke-width="2"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="285" fill="url(#grille)"/>
  <line class="ax" x1="20" y1="130" x2="468" y2="130" marker-end="url(#fl)"/>
  <line x1="32" y1="125" x2="32" y2="135" stroke="#5b6270"/>
  <line x1="58" y1="125" x2="58" y2="135" stroke="#5b6270"/>
  <line x1="84" y1="125" x2="84" y2="135" stroke="#5b6270"/>
  <line x1="110" y1="125" x2="110" y2="135" stroke="#5b6270"/>
  <line x1="136" y1="125" x2="136" y2="135" stroke="#5b6270"/>
  <line x1="162" y1="125" x2="162" y2="135" stroke="#5b6270"/>
  <line x1="188" y1="125" x2="188" y2="135" stroke="#5b6270"/>
  <line x1="214" y1="125" x2="214" y2="135" stroke="#5b6270"/>
  <line x1="240" y1="125" x2="240" y2="135" stroke="#5b6270"/>
  <line x1="266" y1="125" x2="266" y2="135" stroke="#5b6270"/>
  <line x1="292" y1="125" x2="292" y2="135" stroke="#5b6270"/>
  <line x1="318" y1="125" x2="318" y2="135" stroke="#5b6270"/>
  <line x1="344" y1="125" x2="344" y2="135" stroke="#5b6270"/>
  <line x1="370" y1="125" x2="370" y2="135" stroke="#5b6270"/>
  <line x1="396" y1="125" x2="396" y2="135" stroke="#5b6270"/>
  <line x1="422" y1="125" x2="422" y2="135" stroke="#5b6270"/>
  <line x1="448" y1="125" x2="448" y2="135" stroke="#5b6270"/>
  <text x="84" y="156" text-anchor="middle" class="p">−6</text>
  <text x="136" y="156" text-anchor="middle" class="p">−4</text>
  <text x="188" y="156" text-anchor="middle" class="p">−2</text>
  <text x="240" y="156" text-anchor="middle" class="p">0</text>
  <text x="292" y="156" text-anchor="middle" class="p">2</text>
  <text x="344" y="156" text-anchor="middle" class="p">4</text>
  <text x="396" y="156" text-anchor="middle" class="p">6</text>
  <text x="448" y="156" text-anchor="middle" class="p">8</text>
  <g class="anim" style="animation-delay:0.2s"><circle cx="240" cy="130" r="6" fill="#e7e9ee"/><text x="240" y="114" text-anchor="middle" class="g" style="font-size:18px;fill:#e7e9ee">A</text></g>
  <g class="anim" style="animation-delay:0.2s"><circle cx="396" cy="130" r="6" fill="#e7e9ee"/><text x="396" y="114" text-anchor="middle" class="g" style="font-size:18px;fill:#e7e9ee">B</text></g>
  <g class="anim" style="animation-delay:0.5s"><circle cx="292" cy="130" r="6" fill="#f0c674"/><text x="292" y="114" text-anchor="middle" class="g" style="font-size:18px;fill:#f0c674">C</text></g>
  <g class="anim" style="animation-delay:0.8s"><circle cx="318" cy="130" r="6" fill="#6fd3c4"/><text x="318" y="114" text-anchor="middle" class="g" style="font-size:18px;fill:#6fd3c4">I</text></g>
  <g class="anim" style="animation-delay:1.1s"><circle cx="84" cy="130" r="6" fill="#f0c674"/><text x="84" y="114" text-anchor="middle" class="g" style="font-size:18px;fill:#f0c674">D</text></g>
  <g class="anim" style="animation-delay:0.3s"><line x1="240" y1="60" x2="396" y2="60" stroke="#aab2c0" stroke-width="2"/><line x1="240" y1="54" x2="240" y2="66" stroke="#aab2c0" stroke-width="2"/><line x1="396" y1="54" x2="396" y2="66" stroke="#aab2c0" stroke-width="2"/><text x="318.0" y="52" text-anchor="middle" style="font-size:14px;fill:#aab2c0">AB = 6</text></g>
  <g class="anim" style="animation-delay:1.4s"><line x1="318" y1="190" x2="292" y2="190" stroke="#6fd3c4" stroke-width="2"/><line x1="318" y1="184" x2="318" y2="196" stroke="#6fd3c4" stroke-width="2"/><line x1="292" y1="184" x2="292" y2="196" stroke="#6fd3c4" stroke-width="2"/><text x="305.0" y="182" text-anchor="middle" style="font-size:14px;fill:#6fd3c4">IC = −1</text></g>
  <g class="anim" style="animation-delay:1.6s"><line x1="318" y1="222" x2="84" y2="222" stroke="#6fd3c4" stroke-width="2"/><line x1="318" y1="216" x2="318" y2="228" stroke="#6fd3c4" stroke-width="2"/><line x1="84" y1="216" x2="84" y2="228" stroke="#6fd3c4" stroke-width="2"/><text x="201.0" y="214" text-anchor="middle" style="font-size:14px;fill:#6fd3c4">ID = −9</text></g>
  <text class="anim" style="animation-delay:1.9s" x="20" y="262">CA/CB = −2/4 = −0,5   et   DA/DB = 6/12 = +0,5</text>
  <g class="anim" style="animation-delay:2.3s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" style="fill:#f3dcae">Newton : IA² = 9 = IC × ID = (−1) × (−9)</text>
  </g>
</svg>
