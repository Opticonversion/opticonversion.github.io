<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Test de Worth : diplopie homonyme et ésophorie associée</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .or { fill: #f3dcae; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="fr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <rect x="12" y="14" width="250" height="206" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#5b6270" stroke-opacity=".6"/>
  <text x="137" y="38" text-anchor="middle" class="g" style="font-size:15px">Ce que voit le sujet</text>
  <g class="anim" style="animation-delay:.3s"><path d="M50 113.5 H57.5 V106 H66.5 V113.5 H74 V122.5 H66.5 V130 H57.5 V122.5 H50 Z" fill="#5fd08a"/><path d="M110 113.5 H117.5 V106 H126.5 V113.5 H134 V122.5 H126.5 V130 H117.5 V122.5 H110 Z" fill="#5fd08a"/><circle cx="92" cy="148" r="12" fill="#5fd08a"/></g>
  <g class="anim" style="animation-delay:.8s"><path d="M182 75 L195 88 L182 101 L169 88 Z" fill="#ff6b6b"/><circle cx="182" cy="148" r="12" fill="#ff6b6b"/></g>
  <text x="92" y="204" text-anchor="middle" class="p" style="fill:#8fe0ad">OG (vert)</text>
  <text x="182" y="204" text-anchor="middle" class="p" style="fill:#ff9b9b">OD (rouge)</text>
  <text x="370" y="26" text-anchor="middle" class="p">vue de dessus</text>
  <circle cx="370" cy="52" r="6" fill="#f2f2f2"/><text x="382" y="57" class="p">test</text>
  <circle cx="330" cy="196" r="15" fill="none" stroke="#9ec5ff" stroke-width="2"/>
  <text x="330" y="232" text-anchor="middle" class="g" style="font-size:15px">OG</text>
  <line x1="330" y1="181" x2="370" y2="52" stroke="#5b6270" stroke-width="1.5"/>
  <path class="trace" pathLength="1" style="animation-delay:1.3s" d="M338.8 181 L404.1 70" fill="none" stroke="#ff8a7a" stroke-width="2.2" stroke-dasharray="1"/>
  <circle cx="410" cy="196" r="15" fill="none" stroke="#9ec5ff" stroke-width="2"/>
  <text x="410" y="232" text-anchor="middle" class="g" style="font-size:15px">OD</text>
  <line x1="410" y1="181" x2="370" y2="52" stroke="#5b6270" stroke-width="1.5"/>
  <path class="trace" pathLength="1" style="animation-delay:1.3s" d="M401.2 181 L335.9 70" fill="none" stroke="#ff8a7a" stroke-width="2.2" stroke-dasharray="1"/>
  <g class="anim" style="animation-delay:2.2s"><circle cx="370" cy="128" r="4" fill="#ff8a7a"/><text x="345" y="158" text-anchor="end" class="p" style="font-size:13px;fill:#ff9b9b">croisement</text><text x="345" y="173" text-anchor="end" class="p" style="font-size:13px;fill:#ff9b9b">en avant</text></g>
  <g class="anim" style="animation-delay:1.6s">
    <text x="20" y="250" class="p">Image de l'OD du côté de l'OD → diplopie homonyme</text>
    <text x="20" y="274" class="p">Loi de Desmarres : homonyme = éso, croisée = exo</text>
  </g>
  <g class="anim" style="animation-delay:2.6s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" class="or">Diplopie homonyme → ésophorie associée</text>
  </g>
</svg>
