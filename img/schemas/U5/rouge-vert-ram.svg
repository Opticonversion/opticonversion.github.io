<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Test rouge-vert : position des foyers rouge et vert par rapport à la rétine</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .or { fill: #f3dcae; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="fr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <text x="20" y="43" class="g" style="font-size:15px">Équilibre : rouge et vert aussi nets</text>
  <line x1="20" y1="95" x2="460" y2="95" stroke="#5b6270" stroke-width="1.2"/>
  <path d="M90 59 Q102 95 90 131 Q78 95 90 59 Z" fill="#9ec5ff" fill-opacity=".2" stroke="#9ec5ff" stroke-width="1.5"/>
  <line x1="360" y1="55" x2="360" y2="135" stroke="#e7e9ee" stroke-width="3"/>
  <path class="trace" pathLength="1" style="animation-delay:0.2s" d="M90 65 L335 95 L360 98.1" stroke="#5fd08a" stroke-width="2" fill="none"/>
  <path class="trace" pathLength="1" style="animation-delay:0.2s" d="M90 125 L335 95 L360 91.9" stroke="#5fd08a" stroke-width="2" fill="none"/>
  <circle cx="335" cy="95" r="4" fill="#5fd08a"/>
  <path d="M360 92.5 L385 95" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7" fill="none"/>
  <path class="trace" pathLength="1" style="animation-delay:0.7s" d="M90 65 L360 92.5" stroke="#ff6b6b" stroke-width="2" fill="none"/>
  <path d="M360 97.5 L385 95" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7" fill="none"/>
  <path class="trace" pathLength="1" style="animation-delay:0.7s" d="M90 125 L360 97.5" stroke="#ff6b6b" stroke-width="2" fill="none"/>
  <circle cx="385" cy="95" r="4" fill="#ff6b6b"/>
  <text x="366" y="50" class="p" style="font-size:13px">rétine</text>
  <text x="20" y="173" class="g" style="font-size:15px">Rouge plus net : foyers en avant de la rétine</text>
  <line x1="20" y1="225" x2="460" y2="225" stroke="#5b6270" stroke-width="1.2"/>
  <path d="M90 189 Q102 225 90 261 Q78 225 90 189 Z" fill="#9ec5ff" fill-opacity=".2" stroke="#9ec5ff" stroke-width="1.5"/>
  <line x1="360" y1="185" x2="360" y2="265" stroke="#e7e9ee" stroke-width="3"/>
  <path class="trace" pathLength="1" style="animation-delay:1.4s" d="M90 195 L300 225 L360 233.6" stroke="#5fd08a" stroke-width="2" fill="none"/>
  <path class="trace" pathLength="1" style="animation-delay:1.4s" d="M90 255 L300 225 L360 216.4" stroke="#5fd08a" stroke-width="2" fill="none"/>
  <circle cx="300" cy="225" r="4" fill="#5fd08a"/>
  <path class="trace" pathLength="1" style="animation-delay:1.9s" d="M90 195 L350 225 L360 226.2" stroke="#ff6b6b" stroke-width="2" fill="none"/>
  <path class="trace" pathLength="1" style="animation-delay:1.9s" d="M90 255 L350 225 L360 223.8" stroke="#ff6b6b" stroke-width="2" fill="none"/>
  <circle cx="350" cy="225" r="4" fill="#ff6b6b"/>
  <text x="372" y="230" class="p" style="font-size:13px">le rouge est</text><text x="372" y="246" class="p" style="font-size:13px">le plus près</text>
  <text x="20" y="156" class="p" style="font-size:13px">Le vert, plus réfracté, focalise avant le rouge (non à l'échelle).</text>
  <g class="anim" style="animation-delay:2.6s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" class="or">Trop de + : ajouter du − (« RAM »)</text>
  </g>
</svg>
