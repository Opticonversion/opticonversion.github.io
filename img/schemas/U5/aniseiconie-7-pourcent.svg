<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Aniséiconie induite par les lunettes : 7 %, avec les seuils de 3 et 10 %</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .or { fill: #f3dcae; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="fr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <text x="20" y="30" class="p">Images rétiniennes en lunettes (écart exagéré ×3)</text>
  <rect class="anim" style="animation-delay:0.2s" x="82" y="59.1" width="56" height="108.9" rx="4" fill="#f0c674" fill-opacity=".25" stroke="#f0c674" stroke-width="2"/>
  <text x="110" y="190" text-anchor="middle" class="g">OD</text>
  <rect class="anim" style="animation-delay:0.5s" x="202" y="78" width="56" height="90" rx="4" fill="#9ec5ff" fill-opacity=".25" stroke="#9ec5ff" stroke-width="2"/>
  <text x="230" y="190" text-anchor="middle" class="g">OG</text>
  <text x="300" y="80" class="p">OD −0,50 : voit</text><text x="300" y="102" class="p">plus grand que</text><text x="300" y="124" class="p">l'OG −5,50</text>
  <text x="20" y="222" class="g or">1,4 cm × |−0,50 − (−5,50)| = 1,4 × 5 = 7 %</text>
  <rect x="30" y="250" width="105" height="14" fill="#5fd08a" fill-opacity=".35"/>
  <rect x="135" y="250" width="245" height="14" fill="#f0c674" fill-opacity=".35"/>
  <rect x="380" y="250" width="70" height="14" fill="#ff8a7a" fill-opacity=".35"/>
  <text x="30" y="282" text-anchor="middle" class="p" style="font-size:13px">0 %</text>
  <text x="135" y="282" text-anchor="middle" class="p" style="font-size:13px">3 %</text>
  <text x="380" y="282" text-anchor="middle" class="p" style="font-size:13px">10 %</text>
  <text x="82.5" y="244" text-anchor="middle" class="p" style="font-size:13px">pas de gêne</text>
  <text x="205" y="244" text-anchor="middle" class="p" style="font-size:13px">gêne possible</text>
  <text x="415" y="244" text-anchor="middle" class="p" style="font-size:13px">fusion ?</text>
  <g class="anim" style="animation-delay:1.2s"><path d="M275 248 l-7 -10 h14 Z" fill="#ff8a7a"/><line x1="275" y1="250" x2="275" y2="264" stroke="#ff8a7a" stroke-width="3"/></g>
  <g class="anim" style="animation-delay:1.8s">
    <rect x="20" y="298" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="322" text-anchor="middle" class="or">≈ 7 % en faveur de l'OD : gêne possible</text>
  </g>
</svg>
