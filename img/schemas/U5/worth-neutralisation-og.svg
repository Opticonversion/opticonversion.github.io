<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Test de Worth : ce que voit chaque œil, neutralisation de l'OG</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .or { fill: #f3dcae; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="fr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <rect x="15" y="14" width="140" height="160" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#5b6270" stroke-opacity=".6"/>
  <text x="85" y="38" text-anchor="middle" class="g" style="font-size:15px">Le test</text>
  <text x="85" y="164" text-anchor="middle" class="p">4 symboles</text>
  <rect x="170" y="14" width="140" height="160" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#5b6270" stroke-opacity=".6"/>
  <text x="240" y="38" text-anchor="middle" class="g" style="font-size:15px">OD · filtre rouge</text>
  <text x="240" y="164" text-anchor="middle" class="p">voit 2 symboles</text>
  <rect x="325" y="14" width="140" height="160" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#5b6270" stroke-opacity=".6"/>
  <text x="395" y="38" text-anchor="middle" class="g" style="font-size:15px">OG · filtre vert</text>
  <text x="395" y="164" text-anchor="middle" class="p">voit 3 symboles</text>
  <path d="M85 55 L98 68 L85 81 L72 68 Z" fill="#ff6b6b"/><path d="M43 93.5 H50.5 V86 H59.5 V93.5 H67 V102.5 H59.5 V110 H50.5 V102.5 H43 Z" fill="#5fd08a"/><path d="M103 93.5 H110.5 V86 H119.5 V93.5 H127 V102.5 H119.5 V110 H110.5 V102.5 H103 Z" fill="#5fd08a"/><circle cx="85" cy="128" r="12" fill="#f2f2f2"/>
  <g class="anim" style="animation-delay:.4s"><path d="M240 55 L253 68 L240 81 L227 68 Z" fill="#ff6b6b"/><circle cx="210" cy="98" r="13" fill="none" stroke="#5b6270" stroke-dasharray="3 3"/><circle cx="270" cy="98" r="13" fill="none" stroke="#5b6270" stroke-dasharray="3 3"/><circle cx="240" cy="128" r="12" fill="#ff6b6b"/></g>
  <g class="anim" style="animation-delay:.9s"><circle cx="395" cy="68" r="13" fill="none" stroke="#5b6270" stroke-dasharray="3 3"/><path d="M353 93.5 H360.5 V86 H369.5 V93.5 H377 V102.5 H369.5 V110 H360.5 V102.5 H353 Z" fill="#5fd08a"/><path d="M413 93.5 H420.5 V86 H429.5 V93.5 H437 V102.5 H429.5 V110 H420.5 V102.5 H413 Z" fill="#5fd08a"/><circle cx="395" cy="128" r="12" fill="#5fd08a"/></g>
  <g class="anim" style="animation-delay:1.6s">
    <text x="20" y="208" class="p">Le sujet ne voit que :</text>
    <path d="M208 190 L221 203 L208 216 L195 203 Z" fill="#ff6b6b"/><circle cx="240" cy="203" r="12" fill="#ff6b6b"/>
    <text x="266" y="208" class="g">= la vue de l'OD seul</text>
    <text x="20" y="240" class="p">Aucun symbole vert : l'OG ne transmet rien.</text>
    <text x="20" y="266" class="p">Ni vision simultanée (1er degré), ni fusion (2e).</text>
  </g>
  <g class="anim" style="animation-delay:2.4s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" class="or">Seul l'œil au filtre rouge voit → neutralisation de l'OG</text>
  </g>
</svg>
