<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t">
  <title id="t">Cylindre croisé ±0,25 vu de face : axe du cylindre négatif à 90°, manche à 45°</title>
  <style>
    :root { background: #0f1219; color-scheme: dark; }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #e7e9ee; }
    .p { font-size: 15px; fill: #aab2c0; }
    .g { font-weight: 700; }
    .or { fill: #f3dcae; }
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: trace 1s ease-out forwards; }
    .anim { opacity: 0; animation: apparait .5s ease-out forwards; }
    @keyframes trace { to { stroke-dashoffset: 0; } }
    @keyframes apparait { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .anim { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <pattern id="grille" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0 L0 0 L0 18" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <marker id="fo" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f0c674"/></marker>
    <marker id="fg" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#aab2c0"/></marker>
    <marker id="fr" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff8a7a"/></marker>
  </defs>
  <rect x="0" y="0" width="480" height="340" fill="url(#grille)"/>
  <circle cx="140" cy="175" r="92" fill="#9ec5ff" fill-opacity=".07" stroke="#9ec5ff" stroke-width="2.5"/>
  <text x="254" y="180" text-anchor="middle" class="p" style="font-size:13px">0°</text>
  <text x="140" y="66" text-anchor="middle" class="p" style="font-size:13px">90°</text>
  <text x="26" y="180" text-anchor="middle" class="p" style="font-size:13px">180°</text>
  <line x1="205.1" y1="109.9" x2="248.9" y2="66.1" stroke="#c9a46a" stroke-width="10" stroke-linecap="round"/>
  <text x="258.9" y="72.1" class="p">manche à 45°</text>
  <line x1="140" y1="83" x2="140" y2="267" stroke="#ff6b6b" stroke-opacity=".5" stroke-dasharray="4 5"/>
  <line x1="48" y1="175" x2="232" y2="175" stroke="#f2f2f2" stroke-opacity=".4" stroke-dasharray="4 5"/>
  <circle class="anim" style="animation-delay:.4s" cx="140" cy="113" r="6.5" fill="#ff6b6b"/><circle class="anim" style="animation-delay:.9s" cx="78" cy="175" r="6.5" fill="#f2f2f2"/><circle class="anim" style="animation-delay:.4s" cx="140" cy="144" r="6.5" fill="#ff6b6b"/><circle class="anim" style="animation-delay:.9s" cx="109" cy="175" r="6.5" fill="#f2f2f2"/><circle class="anim" style="animation-delay:.4s" cx="140" cy="206" r="6.5" fill="#ff6b6b"/><circle class="anim" style="animation-delay:.9s" cx="171" cy="175" r="6.5" fill="#f2f2f2"/><circle class="anim" style="animation-delay:.4s" cx="140" cy="237" r="6.5" fill="#ff6b6b"/><circle class="anim" style="animation-delay:.9s" cx="202" cy="175" r="6.5" fill="#f2f2f2"/>
  <g class="anim" style="animation-delay:1.3s">
    <circle cx="292" cy="100" r="7" fill="#ff6b6b"/><text x="306" y="105" class="p">axe du cyl. − : 90°</text>
    <circle cx="292" cy="126" r="7" fill="#f2f2f2"/><text x="306" y="131" class="p">axe du cyl. + : 0°</text>
    <text x="270" y="172" class="p">±0,25 se transpose en :</text>
    <text x="270" y="196" class="p">sphère = +0,25</text>
    <text x="270" y="220" class="p">cylindre = 2 × (−0,25) = −0,50</text>
    <text x="270" y="244" class="p">axe = celui des points rouges</text>
  </g>
  <g class="anim" style="animation-delay:2.2s">
    <rect x="20" y="296" width="440" height="36" rx="18" fill="#d9b26f" fill-opacity=".14" stroke="#d9b26f" stroke-opacity=".6"/>
    <text x="240" y="320" text-anchor="middle" class="or">CCR ±0,25 = +0,25 (−0,50) 90°</text>
  </g>
</svg>
