<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="800" height="880">
  <!-- DioSL est vivant : il cligne des yeux et remue les oreilles (animation coupée si l'élève l'a désactivée) -->
  <style>
    .oreille { transform-box: fill-box; transform-origin: 50% 88%; animation: oreille 7s ease-in-out infinite; }
    .oreille.droite { animation-delay: 0.18s; }
    .oeil { transform-box: fill-box; transform-origin: 50% 50%; animation: cligne 5.2s infinite; }
    @keyframes cligne { 0%, 92%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.08); } }
    @keyframes oreille { 0%, 84%, 100% { transform: rotate(0deg); } 89% { transform: rotate(-8deg); } 94% { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .oreille, .oeil { animation: none; } }
  </style>
  <!-- DioSL, clin d'œil (trait à main levée, calculé une fois ; source nette gardée à part) -->
