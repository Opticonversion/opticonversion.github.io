<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="800" height="880">
  <!-- oreilles -->
  <circle cx="98" cy="92" r="56" fill="#b47a45"/>
  <circle cx="302" cy="92" r="56" fill="#b47a45"/>
  <circle cx="98" cy="92" r="31" fill="#f0cfa6"/>
  <circle cx="302" cy="92" r="31" fill="#f0cfa6"/>
  <!-- sweat anthracite, bords or -->
  <path d="M55 440 Q60 345 200 330 Q340 345 345 440 Z" fill="#262b36" stroke="#d9b26f" stroke-width="5" stroke-linejoin="round"/>
  <!-- tete -->
  <ellipse cx="200" cy="205" rx="152" ry="138" fill="#c78d56"/>
  <!-- col cote or -->
  <path d="M140 333 Q200 362 260 333" fill="none" stroke="#d9b26f" stroke-width="10" stroke-linecap="round"/>
  <!-- cordons de capuche -->
  <path d="M178 352 L172 400" stroke="#ecd3a0" stroke-width="6" stroke-linecap="round"/>
  <path d="M222 352 L228 400" stroke="#ecd3a0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="172" cy="404" r="6" fill="#d9b26f"/>
  <circle cx="228" cy="404" r="6" fill="#d9b26f"/>
  <!-- logo O or sur la poitrine -->
  <circle cx="290" cy="400" r="13" fill="none" stroke="#d9b26f" stroke-width="5"/>
  <!-- joues -->
  <ellipse cx="112" cy="256" rx="20" ry="12" fill="#f29a8e" opacity="0.55"/>
  <ellipse cx="288" cy="256" rx="20" ry="12" fill="#f29a8e" opacity="0.55"/>
  <!-- museau -->
  <ellipse cx="200" cy="268" rx="70" ry="54" fill="#f0cfa6"/>
  <!-- verres -->
  <rect x="92" y="160" width="96" height="64" rx="10" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="212" y="160" width="96" height="64" rx="10" fill="#ffffff" fill-opacity="0.16"/>
  <!-- yeux qui regardent en haut à droite -->
  <circle cx="156" cy="187" r="14" fill="#2a1a10"/>
  <circle cx="256" cy="187" r="14" fill="#2a1a10"/>
  <circle cx="161" cy="182" r="5" fill="#ffffff"/>
  <circle cx="261" cy="182" r="5" fill="#ffffff"/>
  <!-- monture acétate noir épaisse, rectangulaire large, haut droit -->
  <rect x="92" y="160" width="96" height="64" rx="10" fill="none" stroke="#111214" stroke-width="15"/>
  <rect x="212" y="160" width="96" height="64" rx="10" fill="none" stroke="#111214" stroke-width="15"/>
  <!-- haut des cercles bien droit et plus épais -->
  <rect x="84" y="149" width="112" height="20" rx="7" fill="#111214"/>
  <rect x="204" y="149" width="112" height="20" rx="7" fill="#111214"/>
  <!-- pont -->
  <rect x="190" y="156" width="20" height="16" rx="3" fill="#111214"/>
  <!-- branches épaisses -->
  <path d="M88 160 L46 150" stroke="#111214" stroke-width="15" stroke-linecap="round"/>
  <path d="M312 160 L354 150" stroke="#111214" stroke-width="15" stroke-linecap="round"/>
  <!-- plaquettes de métal argenté près des tenons -->
  <rect x="60" y="148" width="18" height="8" rx="2" fill="#c9ccd2" transform="rotate(14 69 152)"/>
  <rect x="322" y="148" width="18" height="8" rx="2" fill="#c9ccd2" transform="rotate(-14 331 152)"/>
  <!-- brillance de l'acétate -->
  <path d="M94 154 L186 154" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <path d="M214 154 L306 154" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
  <!-- reflets -->
  <path d="M120 180 L138 168" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  <path d="M224 180 L242 168" stroke="#ffffff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>
  <!-- nez -->
  <ellipse cx="200" cy="246" rx="23" ry="16" fill="#3a2618"/>
  <ellipse cx="193" cy="241" rx="7" ry="4" fill="#ffffff" opacity="0.5"/>
  <path d="M200 261 L200 273" stroke="#3a2618" stroke-width="5" stroke-linecap="round"/>
  <!-- bouche de travers, hésitante -->
  <path d="M178 286 Q192 280 204 286 Q214 291 224 282" stroke="#3a2618" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- un sourcil levé, l'autre froncé -->
  <path d="M116 132 Q142 128 166 136" stroke="#5a3a22" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M234 128 Q260 108 286 120" stroke="#5a3a22" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- goutte de sueur -->
  <path d="M338 168 Q350 188 338 198 Q326 188 338 168 Z" fill="#9fd3f5" stroke="#ffffff" stroke-width="2"/>
  <!-- petits points de réflexion -->
  <circle cx="330" cy="60" r="6" fill="#ecd3a0"/>
  <circle cx="352" cy="38" r="8" fill="#ecd3a0"/>
  <circle cx="380" cy="14" r="10" fill="#ecd3a0"/>
</svg>
